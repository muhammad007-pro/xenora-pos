<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#d4b46c;--gold-dim:rgba(34,197,94,.15);--bg:#070f1e;--bg2:#0a1628;--bg3:#0f2038;--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.12);--text:#e8eef5;--text2:#8b9bb0;--text3:#6b7d94;--green:#22c55e;--red:#ef4444;--amber:#f59e0b;--r:.5rem;--r2:.875rem}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.ph{display:flex;align-items:center;gap:.75rem;padding:.875rem 1.5rem;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.bk{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:var(--r);background:var(--bg3);border:1px solid var(--border);color:var(--text2);text-decoration:none;font-size:1.1rem;transition:.2s}
.bk:hover{border-color:var(--gold);color:var(--gold)}
.ph-title{font-size:1.125rem;font-weight:700;color:var(--gold);flex:1}
.btn{display:inline-flex;align-items:center;gap:.375rem;padding:.5rem 1rem;border-radius:var(--r);font-size:.875rem;font-weight:600;cursor:pointer;border:none;transition:.2s;font-family:inherit}
.btn-gold{background:var(--gold);color:#04160d}
.btn-gold:hover{opacity:.9}
.btn-gold:disabled{opacity:.5;cursor:not-allowed}
.btn-out{background:transparent;border:1px solid var(--border2);color:var(--text2)}
.btn-out:hover{border-color:var(--gold);color:var(--gold)}
.btn-red{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:var(--red)}

.pc{padding:1.5rem;max-width:1300px;margin:0 auto;display:grid;grid-template-columns:340px 1fr;gap:1.25rem}
@media(max-width:900px){.pc{grid-template-columns:1fr}}

/* ─── Sol panel ─── */
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:1.25rem}
.panel-title{font-size:.75rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:1rem}
.form-group{margin-bottom:.875rem}
.form-group label{display:block;font-size:.8125rem;font-weight:500;color:var(--text2);margin-bottom:.375rem}
.form-control{width:100%;padding:.5rem .875rem;border-radius:var(--r);border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:.875rem;outline:none;font-family:inherit;transition:.2s}
.form-control:focus{border-color:var(--gold)}
select.form-control option{background:var(--bg2)}

/* ─── Rejim tanlash (TSPL / A4) ─── */
.mode-tabs{display:flex;gap:.375rem;margin-bottom:1rem}
.mode-tab{flex:1;padding:.5rem .5rem;border-radius:var(--r);border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-size:.8125rem;font-weight:600;cursor:pointer;transition:.2s;font-family:inherit;line-height:1.25}
.mode-tab small{display:block;font-size:.65rem;font-weight:400;color:var(--text3);margin-top:.125rem}
.mode-tab.active{border-color:var(--gold);color:var(--gold);background:var(--gold-dim)}
.mode-note{font-size:.75rem;color:var(--text3);margin-bottom:.875rem;line-height:1.45}
.mode-note.warn{color:var(--amber)}

.search-wrap{position:relative}
.search-wrap input{padding-left:2rem}
.search-ico{position:absolute;left:.65rem;top:50%;transform:translateY(-50%);color:var(--text3);font-size:.875rem}

.product-list{max-height:320px;overflow-y:auto;margin-top:.5rem;display:flex;flex-direction:column;gap:.375rem}
.product-item{display:flex;align-items:center;gap:.625rem;padding:.5rem .75rem;border-radius:var(--r);border:1px solid var(--border);cursor:pointer;transition:.2s;background:var(--bg3)}
.product-item:hover{border-color:var(--gold);background:var(--gold-dim)}
.product-item.selected{border-color:var(--gold);background:var(--gold-dim)}
.product-item input[type=checkbox]{accent-color:var(--gold);width:16px;height:16px;flex-shrink:0}
.product-item-info{flex:1;min-width:0}
.product-item-name{font-size:.8125rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.product-item-price{font-size:.75rem;color:var(--gold);font-weight:600}
.product-item-barcode{font-size:.6875rem;color:var(--text3);font-family:'JetBrains Mono',monospace}

/* Barcode'siz mahsulot — tanlab bo'lmaydi (chop etishga qo'shilmaydi) */
.product-item.no-barcode{opacity:.55;cursor:not-allowed}
.product-item.no-barcode:hover{border-color:var(--border);background:var(--bg3)}
.nb-warn{font-size:.6875rem;color:var(--amber);display:flex;align-items:center;gap:.25rem}

/* Har mahsulot qatoridagi son maydoni */
.pi-qty{width:58px;flex-shrink:0;text-align:center;padding:.3rem .25rem;border-radius:var(--r);border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:.8125rem;font-family:inherit;outline:none}
.pi-qty:focus{border-color:var(--gold)}
.pi-qty:disabled{opacity:.35}

.qty-row{display:flex;align-items:center;gap:.5rem}
.qty-row input{width:70px;text-align:center}

.size-btns{display:flex;gap:.375rem;flex-wrap:wrap}
.size-btn{padding:.375rem .75rem;border-radius:var(--r);border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-size:.8125rem;cursor:pointer;transition:.2s;font-family:inherit}
.size-btn.active{border-color:var(--gold);color:var(--gold);background:var(--gold-dim)}

.dim-row{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}

/* ─── O'ng panel: preview ─── */
.preview-panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:1.25rem}
.preview-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;gap:.5rem;flex-wrap:wrap}
.preview-grid{display:flex;flex-wrap:wrap;gap:.75rem;padding:.75rem;background:var(--bg3);border-radius:var(--r);min-height:200px;border:1px solid var(--border)}
.empty-preview{width:100%;text-align:center;padding:3rem;color:var(--text3);font-size:.875rem}

/* ─── Etiketka stillari (screen ko'rinishi) ─── */
.label-card{background:#fff;color:#000;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;border:1px solid #ddd;flex-shrink:0;position:relative}
.label-card.sz-sm{width:120px;min-height:76px}
.label-card.sz-p40{width:120px;min-height:92px}
.label-card.sz-md{width:175px;min-height:120px}
.label-card.sz-lg{width:220px;min-height:140px}

.label-name{font-size:8px;font-weight:700;text-align:center;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.label-card.sz-md .label-name{font-size:10px}
.label-card.sz-lg .label-name{font-size:12px}

.label-price{font-size:14px;font-weight:900;text-align:center;line-height:1;margin:2px 0}
.label-card.sz-md .label-price{font-size:18px}
.label-card.sz-lg .label-price{font-size:22px}

.label-barcode svg,.label-barcode canvas{max-width:100%;height:auto}

.label-qty-badge{position:absolute;top:2px;right:3px;font-size:7px;background:#333;color:#fff;border-radius:2px;padding:0 3px}

/* ─── Xabar (toast) ─── */
.toast{position:fixed;left:50%;bottom:1.25rem;transform:translateX(-50%);z-index:100;max-width:min(90vw,460px);
  padding:.7rem 1rem;border-radius:var(--r);font-size:.8125rem;line-height:1.4;display:none;
  background:var(--bg3);border:1px solid var(--border2);color:var(--text);box-shadow:0 6px 24px rgba(0,0,0,.45)}
.toast.ok{border-color:rgba(34,197,94,.45);color:#86efac}
.toast.err{border-color:rgba(239,68,68,.45);color:#fca5a5}
.toast.warn{border-color:rgba(245,158,11,.45);color:#fcd34d}

/* ─── PRINT ─── */
@media print {
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{
    position:fixed;top:0;left:0;width:100%;
    display:flex;flex-wrap:wrap;gap:0;
    align-content:flex-start;
    background:#fff;padding:4mm;
  }
  .label-card{
    border:0.5px solid #ccc;
    page-break-inside:avoid;
    margin:1mm;
  }
  .label-qty-badge{display:none}
  .ph,.panel,.preview-header,.toast{display:none}
}
</style>

<body>
<div class="xa-atmos" aria-hidden="true"></div>
<div class="ph">
  <a class="bk" href="admin.html">←</a>
  <div class="ph-title">🏷 Etiketka Chop Etish</div>
  <button class="btn btn-out" onclick="clearAll()">Tozalash</button>
  <button class="btn btn-gold" id="printBtn" onclick="printLabels()">🖨 Chop Etish</button>
</div>

<div class="pc">
  <!-- ── SOL PANEL ── -->
  <div>
    <div class="panel" style="margin-bottom:1rem">
      <div class="panel-title">Chop etish rejimi</div>
      <div class="mode-tabs">
        <button class="mode-tab" id="tabTspl" onclick="setMode('tspl')">🏷 Etiketka printeri<small>TSPL · LAN</small></button>
        <button class="mode-tab active" id="tabA4" onclick="setMode('a4')">🖨 Oddiy printer<small>A4 · brauzer</small></button>
      </div>
      <div class="mode-note" id="modeNote">Yuklanmoqda...</div>

      <div class="panel-title" style="margin-top:1.25rem">Sozlamalar</div>
      <div class="form-group">
        <label>O'lcham</label>
        <div class="size-btns">
          <button class="size-btn active" onclick="setSize('sm',this)">Kichik<br><span style="font-size:.65rem;color:var(--text3)">40×25mm</span></button>
          <button class="size-btn" onclick="setSize('p40',this)">Yorliq<br><span style="font-size:.65rem;color:var(--text3)">40×30mm</span></button>
          <button class="size-btn" onclick="setSize('md',this)">O'rta<br><span style="font-size:.65rem;color:var(--text3)">58×40mm</span></button>
          <button class="size-btn" onclick="setSize('lg',this)">Katta<br><span style="font-size:.65rem;color:var(--text3)">72×50mm</span></button>
        </div>
      </div>

      <!-- TSPL rejimida: aniq mm o'lchamlari (sozlamadan keladi, bu yerda ham o'zgartirsa bo'ladi) -->
      <div id="tsplDims" style="display:none">
        <div class="dim-row">
          <div class="form-group"><label>Kenglik (mm)</label><input class="form-control" type="number" id="tsplW" min="10" max="120"></div>
          <div class="form-group"><label>Balandlik (mm)</label><input class="form-control" type="number" id="tsplH" min="10" max="120"></div>
        </div>
        <div class="mode-note" id="tsplTarget"></div>
      </div>

      <!-- A4 rejimida: barcode turi (TSPL'da printer o'zi tanlaydi) -->
      <div class="form-group" id="a4Format">
        <label>Barcode turi</label>
        <select class="form-control" id="barcodeFormat" onchange="renderPreview()">
          <option value="CODE128">Code-128 (universal)</option>
          <option value="EAN13">EAN-13 (13 raqam)</option>
          <option value="CODE39">Code-39</option>
        </select>
      </div>

      <div class="form-group">
        <label>Standart son (yangi tanlanganlar uchun)</label>
        <div class="qty-row">
          <input class="form-control" type="number" id="globalQty" value="1" min="1" max="999">
          <button class="btn btn-out" style="padding:.5rem .625rem" onclick="applyQtyToAll()">Barchasiga</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Mahsulotlar</div>
      <div class="form-group">
        <div class="search-wrap">
          <span class="search-ico">🔍</span>
          <input class="form-control" type="text" id="searchInput" placeholder="Mahsulot qidirish..." oninput="filterProducts()">
        </div>
      </div>
      <div class="product-list" id="productList">
        <div style="text-align:center;padding:2rem;color:var(--text3);font-size:.875rem">Yuklanmoqda...</div>
      </div>
      <div style="margin-top:.75rem;font-size:.75rem;color:var(--text3)" id="selectedCount">0 ta tanlangan</div>
    </div>
  </div>

  <!-- ── O'NG PANEL: PREVIEW ── -->
  <div class="preview-panel">
    <div class="preview-header">
      <div class="panel-title" style="margin:0">Preview</div>
      <div style="font-size:.8125rem;color:var(--text3)" id="totalCount">Jami: 0 mahsulot, 0 etiketka</div>
    </div>
    <div class="preview-grid" id="previewGrid">
      <div class="empty-preview">Mahsulot tanlanmagan</div>
    </div>
  </div>
</div>

<!-- PRINT AREA (ko'rinmas, faqat print uchun) -->
<div id="printArea" style="display:none"></div>
<div class="toast" id="toastBox"></div>

<script type="module">
import { API_BASE } from '../js/core/config.js';
import { getToken } from '../js/core/auth.js';
import { initErrorHandler } from '../js/core/error-handler.js';
initErrorHandler();

const API = API_BASE;   // getApiBase() hech qachon mavjud bo'lmagan (config.js API_BASE eksport qiladi)
let allProducts = [];
let selected = {};   // product_id → { product, qty }
let currentSize = 'sm';
let mode = 'a4';     // 'a4' (window.print) yoki 'tspl' (etiketka printeri, LAN)
let labelCfg = null; // GET /settings/label-printer natijasi

// O'lcham kaliti → mm. TSPL rejimida shu qiymatlar printerga uzatiladi;
// A4 rejimida faqat ekran/print CSS klassi (sz-*) ishlatiladi.
const SIZES = {
  sm:  { w: 40, h: 25 },
  p40: { w: 40, h: 30 },   // Faza Parfum yorlig'i
  md:  { w: 58, h: 40 },
  lg:  { w: 72, h: 50 },
};

function toast(msg, kind) {
  const b = document.getElementById('toastBox');
  b.className = 'toast ' + (kind || '');
  b.textContent = msg;
  b.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { b.style.display = 'none'; }, kind === 'err' ? 6000 : 3500);
}

// ── Etiketka printeri sozlamasi ──────────────────────────────────────────────
// enabled=true bo'lsa TSPL rejimi DEFAULT bo'lib ochiladi (3-bosqich sozlamasi).
async function loadLabelConfig() {
  try {
    const r = await fetch(`${API}/settings/label-printer`, {
      headers: { Authorization: 'Bearer ' + getToken() }
    });
    if (r.ok) labelCfg = await r.json();
  } catch { /* sozlama o'qilmadi — A4 rejimida qolamiz */ }

  if (labelCfg && labelCfg.enabled) {
    document.getElementById('tsplW').value = labelCfg.label_width || 40;
    document.getElementById('tsplH').value = labelCfg.label_height || 30;
    // Sozlamadagi o'lchamga mos tugmani faollashtiramiz (mos kelmasa — hech biri)
    const key = Object.keys(SIZES).find(k =>
      SIZES[k].w === labelCfg.label_width && SIZES[k].h === labelCfg.label_height);
    if (key) currentSize = key;
    syncSizeButtons();
    setMode('tspl');
  } else {
    document.getElementById('tsplW').value = 40;
    document.getElementById('tsplH').value = 30;
    setMode('a4');
  }
}

window.setMode = function(m) {
  mode = m === 'tspl' ? 'tspl' : 'a4';
  document.getElementById('tabTspl').classList.toggle('active', mode === 'tspl');
  document.getElementById('tabA4').classList.toggle('active', mode === 'a4');
  document.getElementById('tsplDims').style.display = mode === 'tspl' ? 'block' : 'none';
  document.getElementById('a4Format').style.display = mode === 'tspl' ? 'none' : 'block';
  document.getElementById('printBtn').textContent = mode === 'tspl' ? '🏷 Etiketka chop etish' : '🖨 Chop Etish';

  const note = document.getElementById('modeNote');
  if (mode === 'tspl') {
    const ip = labelCfg && labelCfg.printer_ip;
    if (!labelCfg || !labelCfg.enabled) {
      note.className = 'mode-note warn';
      note.textContent = "Etiketka printeri sozlanmagan — Sozlamalar → Chek sozlamalari → Etiketka printeri bo'limida yoqing.";
    } else if (!ip) {
      note.className = 'mode-note warn';
      note.textContent = 'Etiketka printeri IP manzili kiritilmagan.';
    } else {
      note.className = 'mode-note';
      note.textContent = `Yorliqlar to'g'ridan-to'g'ri ${ip}:${labelCfg.printer_port || 9100} printeriga yuboriladi (XENORA desktop ilovasi kerak).`;
    }
    document.getElementById('tsplTarget').textContent =
      labelCfg && labelCfg.printer_ip ? `Printer: ${labelCfg.printer_ip}:${labelCfg.printer_port || 9100}` : '';
  } else {
    note.className = 'mode-note';
    note.textContent = "Brauzer chop etish oynasi ochiladi (A4 varaqda bir nechta yorliq). Oddiy printer uchun.";
  }
  renderPreview();
};

async function loadProducts() {
  try {
    const r = await fetch(`${API}/products/?page_size=500`, {
      headers: { Authorization: 'Bearer ' + getToken() }
    });
    if (!r.ok) throw new Error();
    const data = await r.json();
    allProducts = Array.isArray(data) ? data : (data.items || []);
    renderList(allProducts);
  } catch {
    document.getElementById('productList').innerHTML =
      '<div style="color:var(--red);text-align:center;padding:1rem;font-size:.8rem">Yuklab bo\'lmadi</div>';
  }
}

function renderList(products) {
  const el = document.getElementById('productList');
  if (!products.length) {
    el.innerHTML = '<div style="text-align:center;padding:1.5rem;color:var(--text3);font-size:.8rem">Mahsulot topilmadi</div>';
    return;
  }
  el.innerHTML = products.map(p => {
    // Barcode yo'q → tanlab bo'lmaydi. Etiketkaning butun mazmuni barcode'da;
    // soxta kod chop etilsa skaner uni topa olmaydi. (Keyingi bosqich: avtomatik
    // ichki barcode generatsiyasi.)
    const noBc = !p.barcode;
    const on = !!selected[p.id];
    return `
    <div class="product-item ${on ? 'selected' : ''} ${noBc ? 'no-barcode' : ''}"
         ${noBc ? '' : `onclick="toggleProduct(${p.id})"`} data-id="${p.id}">
      <input type="checkbox" ${on ? 'checked' : ''} ${noBc ? 'disabled' : ''}
             ${noBc ? '' : `onclick="event.stopPropagation();toggleProduct(${p.id})"`}>
      <div class="product-item-info">
        <div class="product-item-name">${escHtml(p.name)}</div>
        <div class="product-item-price">${fmtNum(p.price)} so'm</div>
        ${p.barcode
          ? `<div class="product-item-barcode">${escHtml(p.barcode)}</div>`
          : `<div class="nb-warn">⚠ barcode yo'q — chop etilmaydi</div>`}
      </div>
      <input type="number" class="pi-qty" min="1" max="999"
             value="${on ? selected[p.id].qty : (parseInt(document.getElementById('globalQty')?.value, 10) || 1)}"
             ${noBc ? 'disabled' : ''}
             onclick="event.stopPropagation()"
             oninput="setQty(${p.id}, this)">
    </div>`;
  }).join('');
}

window.toggleProduct = function(id) {
  const p = allProducts.find(x => x.id === id);
  if (!p || !p.barcode) return;
  if (selected[id]) {
    delete selected[id];
  } else {
    const row = document.querySelector(`[data-id="${id}"] .pi-qty`);
    const qty = clampQty(row ? row.value : null) || parseInt(document.getElementById('globalQty').value, 10) || 1;
    selected[id] = { product: p, qty };
  }
  const el = document.querySelector(`[data-id="${id}"]`);
  if (el) el.classList.toggle('selected', !!selected[id]);
  const cb = el?.querySelector('input[type=checkbox]');
  if (cb) cb.checked = !!selected[id];
  updateSelectedCount();
  renderPreview();
};

// Son 1..999 — bo'sh yoki noto'g'ri kiritishda 1 ga tushadi.
function clampQty(v) {
  const n = parseInt(v, 10);
  if (!Number.isFinite(n)) return null;
  return Math.min(999, Math.max(1, n));
}

// Qator ichidagi son maydoni. Mahsulot hali tanlanmagan bo'lsa — son kiritish
// uni AVTOMATIK tanlaydi (kassir "12" yozib, keyin belgilashni unutmasin).
window.setQty = function(id, input) {
  const p = allProducts.find(x => x.id === id);
  if (!p || !p.barcode) return;
  const q = clampQty(input.value);
  if (q === null) return;                 // hali yozmoqda (bo'sh maydon) — tegmaymiz
  if (String(q) !== String(input.value)) input.value = q;
  if (!selected[id]) {
    selected[id] = { product: p, qty: q };
    const el = document.querySelector(`[data-id="${id}"]`);
    if (el) el.classList.add('selected');
    const cb = el?.querySelector('input[type=checkbox]');
    if (cb) cb.checked = true;
  } else {
    selected[id].qty = q;
  }
  updateSelectedCount();
  renderPreview();
};

// "Barchasiga" — standart sonni barcha TANLANGAN mahsulotlarga qo'llaydi.
window.applyQtyToAll = function() {
  const q = clampQty(document.getElementById('globalQty').value) || 1;
  Object.values(selected).forEach(e => { e.qty = q; });
  document.querySelectorAll('.product-item.selected .pi-qty').forEach(i => { i.value = q; });
  renderPreview();
};

window.filterProducts = function() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  renderList(q ? allProducts.filter(p =>
    p.name.toLowerCase().includes(q) ||
    (p.barcode || '').toLowerCase().includes(q)
  ) : allProducts);
};

function syncSizeButtons() {
  const order = ['sm', 'p40', 'md', 'lg'];
  const idx = order.indexOf(currentSize);
  document.querySelectorAll('.size-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
}

window.setSize = function(sz, btn) {
  currentSize = sz;
  document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  // TSPL mm maydonlarini ham ergashtiramiz (printerga aynan shu ketadi)
  if (SIZES[sz]) {
    document.getElementById('tsplW').value = SIZES[sz].w;
    document.getElementById('tsplH').value = SIZES[sz].h;
  }
  renderPreview();
};

window.renderPreview = function() {
  const grid = document.getElementById('previewGrid');
  const entries = Object.values(selected);

  if (!entries.length) {
    grid.innerHTML = '<div class="empty-preview">Mahsulot tanlanmagan</div>';
    document.getElementById('totalCount').textContent = 'Jami: 0 mahsulot, 0 etiketka';
    return;
  }

  const totalLabels = entries.reduce((s, e) => s + e.qty, 0);
  document.getElementById('totalCount').textContent =
    `Jami: ${entries.length} mahsulot, ${totalLabels} etiketka`;

  // Preview'da har mahsulotdan BITTA namuna + son belgisi (100 dona yorliqni
  // ekranga chizish shart emas — brauzer qotib qoladi).
  grid.innerHTML = entries.map(({ product: p, qty }) =>
    buildLabelHtml(p, currentSize, qty)
  ).join('');

  // Barcode render
  grid.querySelectorAll('svg[data-barcode]').forEach(svg => {
    const val = svg.dataset.barcode;
    const fmt = document.getElementById('barcodeFormat').value;
    try {
      JsBarcode(svg, val, {
        format: fmt,
        width: 1,
        height: currentSize === 'sm' ? 18 : currentSize === 'md' ? 24 : 30,
        displayValue: false,
        margin: 0,
      });
    } catch {
      // EAN-13 uchun 13 raqam kerak — noto'g'ri formatda jimgina o'tadi
      JsBarcode(svg, val, { format: 'CODE128', width: 1, height: 20, displayValue: false, margin: 0 });
    }
  });
};

function buildLabelHtml(p, sz, qty) {
  const barcodeVal = p.barcode || String(p.id).padStart(8, '0');
  const badge = qty && qty > 1 ? `<div class="label-qty-badge">×${qty}</div>` : '';
  return `
    <div class="label-card sz-${sz}">
      ${badge}
      <div class="label-name">${escHtml(p.name)}</div>
      <div class="label-barcode">
        <svg data-barcode="${escHtml(barcodeVal)}"></svg>
      </div>
      <div style="font-size:${sz==='sm'?'7px':'9px'};color:#555;font-family:monospace">${escHtml(barcodeVal)}</div>
      <div class="label-price">${fmtNum(p.price)} so'm</div>
    </div>
  `;
}

// ── Chop etish — rejimga qarab ajraladi ──────────────────────────────────────
window.printLabels = function() {
  const entries = Object.values(selected);
  if (!entries.length) {
    toast('Hech qanday mahsulot tanlanmagan', 'warn');
    return;
  }
  if (mode === 'tspl') return printLabelsTspl(entries);
  return printLabelsA4(entries);
};

// ── A4 (MAVJUD YO'L — window.print) ──────────────────────────────────────────
function printLabelsA4(entries) {
  const printArea = document.getElementById('printArea');
  const fmt = document.getElementById('barcodeFormat').value;

  printArea.innerHTML = entries.map(({ product: p, qty }) =>
    Array.from({ length: qty }, () => buildLabelHtml(p, currentSize)).join('')
  ).join('');
  printArea.style.display = 'flex';

  // SVG render for print
  printArea.querySelectorAll('svg[data-barcode]').forEach(svg => {
    const val = svg.dataset.barcode;
    try {
      JsBarcode(svg, val, {
        format: fmt,
        width: currentSize === 'sm' ? 1 : 1.2,
        height: currentSize === 'sm' ? 20 : currentSize === 'md' ? 28 : 36,
        displayValue: false,
        margin: 0,
      });
    } catch {
      JsBarcode(svg, val, { format: 'CODE128', width: 1, height: 22, displayValue: false, margin: 0 });
    }
  });

  setTimeout(() => {
    window.print();
    printArea.style.display = 'none';
  }, 200);
}

// ── TSPL (etiketka printeri, LAN) ────────────────────────────────────────────
// qty printerga PRINT 1,{qty} bo'lib ketadi — takrorlashni PRINTER bajaradi
// (bayt oqimi kichik, chop etish tez).
async function printLabelsTspl(entries) {
  if (!labelCfg || !labelCfg.enabled) {
    toast("Etiketka printeri yoqilmagan — Sozlamalar → Etiketka printeri bo'limida yoqing", 'err');
    return;
  }
  if (!labelCfg.printer_ip) {
    toast('Etiketka printeri IP manzili kiritilmagan', 'err');
    return;
  }
  if (!(window.electronAPI && window.electronAPI.printDocument)) {
    toast('Etiketka printeri faqat XENORA desktop (.exe) ilovasida ishlaydi', 'warn');
    return;
  }

  const items = entries.map(({ product: p, qty }) => ({
    name: p.name,
    price: p.price,
    barcode: p.barcode,
    qty,
  }));

  const w = clampDim(document.getElementById('tsplW').value, labelCfg.label_width || 40);
  const h = clampDim(document.getElementById('tsplH').value, labelCfg.label_height || 30);

  const btn = document.getElementById('printBtn');
  btn.disabled = true;
  const orig = btn.textContent;
  btn.textContent = 'Yuborilmoqda...';
  try {
    const res = await window.electronAPI.printDocument({
      printType: 'label_lan',
      printerIp: labelCfg.printer_ip,
      printerPort: labelCfg.printer_port || 9100,
      labelWidth: w, labelHeight: h,
      gap: labelCfg.gap, density: labelCfg.density, speed: labelCfg.speed,
      currency: "so'm",
      items,
    });
    if (res && res.ok) {
      const total = entries.reduce((s, e) => s + e.qty, 0);
      toast(`${total} ta etiketka yuborildi (${labelCfg.printer_ip})`, 'ok');
    } else {
      toast('Etiketka xato: ' + ((res && res.error) || "noma'lum"), 'err');
    }
  } catch (e) {
    toast('Etiketka xato: ' + (e?.message || e), 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = orig;
  }
}

function clampDim(v, dflt) {
  const n = parseInt(v, 10);
  if (!Number.isFinite(n) || n < 10 || n > 120) return dflt;
  return n;
}

window.clearAll = function() {
  selected = {};
  document.querySelectorAll('.product-item').forEach(el => {
    el.classList.remove('selected');
    const cb = el.querySelector('input[type=checkbox]');
    if (cb) cb.checked = false;
  });
  updateSelectedCount();
  renderPreview();
};

function updateSelectedCount() {
  const n = Object.keys(selected).length;
  const total = Object.values(selected).reduce((s, e) => s + e.qty, 0);
  document.getElementById('selectedCount').textContent =
    n ? `${n} ta tanlangan · ${total} etiketka` : '0 ta tanlangan';
}

function fmtNum(n) {
  return Number(n).toLocaleString('uz-UZ');
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

loadProducts();
loadLabelConfig();
</script>
