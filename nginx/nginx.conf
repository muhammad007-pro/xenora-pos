worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss
               application/atom+xml image/svg+xml;

    # Rate limiting — IP bo'yicha (brute-force himoyasi)
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    # ─── HTTP → HTTPS yo'naltirish ────────────────────────────────────────────
    # SSL sertifikati mavjud bo'lganda (nginx/ssl/ papkasi) port 443 ishlatiladi.
    # Sertifikatsiz (oddiy HTTP) server: hammasi port 80 orqali ishlaydi.
    # Certbot uchun: make ssl-init domenName=your.domain.com
    # ─────────────────────────────────────────────────────────────────────────

    server {
        listen 80;
        server_name _;

        # Let's Encrypt ACME challenge (certbot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # SSL aktiv bo'lganda — barcha HTTP → HTTPS
        # Bu blokni faollashtirish uchun nginx/ssl/ papkasida sertifikat kerak
        # location / {
        #     return 301 https://$host$request_uri;
        # }

        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/conf.d/common.conf;
    }

    # ─── HTTPS server (SSL faollashtirilgandan so'ng uncomment qiling) ────────
    # server {
    #     listen 443 ssl http2;
    #     server_name your.domain.com;
    #
    #     ssl_certificate     /etc/nginx/ssl/live/your.domain.com/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/live/your.domain.com/privkey.pem;
    #
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #     ssl_stapling        on;
    #     ssl_stapling_verify on;
    #
    #     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
