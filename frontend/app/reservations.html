<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
<script>/*XENORA_SERVER_CAP*/if(window.Capacitor&&!window.XENORA_SERVER)window.XENORA_SERVER='http://146.190.225.168';</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Bronlar | XENORA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#d4b46c;--gold-dim:rgba(34,197,94,.15);--gold-glow:0 0 18px rgba(34,197,94,.35);--bg:#070f1e;--bg2:#0a1628;--bg3:#0f2038;--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.12);--text:#e8eef5;--text2:#8b9bb0;--text3:#6b7d94;--green:#22c55e;--red:#ef4444;--yellow:#f59e0b;--blue:#3b82f6;--r:.5rem;--r2:.875rem;--r3:1.125rem}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.ph{display:flex;align-items:center;gap:.75rem;padding:.875rem 1.5rem;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.bk{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:var(--r);background:var(--bg3);border:1px solid var(--border);color:var(--text2);text-decoration:none;font-size:1.1rem;transition:.2s}
.bk:hover{border-color:var(--gold);color:var(--gold)}
.ph-title{font-size:1.125rem;font-weight:700;color:var(--gold);flex:1}
.btn{display:inline-flex;align-items:center;gap:.375rem;padding:.5rem 1rem;border-radius:var(--r);font-size:.875rem;font-weight:600;cursor:pointer;border:none;transition:.2s;font-family:inherit}
.btn-gold{background:linear-gradient(135deg,#16a34a,#22c55e,#16a34a);color:#04160d}
.btn-gold:hover{box-shadow:var(--gold-glow)}
.btn-out{background:transparent;border:1px solid var(--border2);color:var(--text2)}
.btn-out:hover{border-color:var(--gold);color:var(--gold)}
.btn-sm{padding:.35rem .75rem;font-size:.8125rem}
.pc{padding:1.5rem;max-width:1100px;margin:0 auto}
.toolbar{display:flex;gap:.75rem;margin-bottom:1.25rem;align-items:center;flex-wrap:wrap}
.date-nav{display:flex;align-items:center;gap:.5rem}
.date-nav button{width:32px;height:32px;border-radius:var(--r);background:var(--bg2);border:1px solid var(--border);color:var(--text2);cursor:pointer;font-size:1rem;transition:.2s}
.date-nav button:hover{border-color:var(--gold);color:var(--gold)}
.date-lbl{font-size:.9rem;font-weight:600;min-width:140px;text-align:center}
.date-inp{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:.4rem .75rem;color:var(--text);font-size:.875rem;outline:none;font-family:inherit}
.date-inp:focus{border-color:var(--gold)}
.fsel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:.5rem .875rem;color:var(--text2);font-size:.875rem;outline:none;cursor:pointer;font-family:inherit;margin-left:auto}
.fsel:focus{border-color:var(--gold)}
.rlist{display:flex;flex-direction:column;gap:.75rem}
.rcard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:1.125rem 1.25rem;display:flex;gap:1rem;align-items:flex-start;transition:.2s}
.rcard:hover{border-color:var(--border2)}
.rcard.pending{border-left:3px solid var(--yellow)}.rcard.confirmed{border-left:3px solid var(--gold)}.rcard.completed{border-left:3px solid var(--green)}.rcard.cancelled{border-left:3px solid var(--red);opacity:.6}
.rtime{flex-shrink:0;text-align:center;background:var(--bg3);border-radius:var(--r);padding:.5rem .875rem;min-width:72px}
.rtime .hr{font-size:1.25rem;font-weight:700;color:var(--gold)}.rtime .dur{font-size:.75rem;color:var(--text3);margin-top:.15rem}
.rinfo{flex:1}.rname{font-weight:600;font-size:.9375rem}.rmeta{font-size:.8125rem;color:var(--text2);margin-top:.2rem}.rnote{font-size:.75rem;color:var(--text3);margin-top:.2rem}
.racts{display:flex;gap:.375rem;flex-shrink:0;align-items:center;flex-wrap:wrap}
.badge{padding:.2rem .5rem;border-radius:99px;font-size:.75rem;font-weight:600}
.b-pending{background:rgba(245,158,11,.12);color:var(--yellow)}.b-confirmed{background:var(--gold-dim);color:var(--gold)}.b-completed{background:rgba(16,185,129,.12);color:var(--green)}.b-cancelled{background:rgba(239,68,68,.1);color:var(--red)}
.empty{text-align:center;padding:3rem;color:var(--text3)}
.modal{display:none;position:fixed;inset:0;z-index:100;align-items:center;justify-content:center;background:rgba(0,0,0,.7);backdrop-filter:blur(4px)}
.modal.open{display:flex}
.mc{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r3);width:100%;max-width:480px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.mh{display:flex;align-items:center;justify-content:space-between;padding:1.125rem 1.25rem;border-bottom:1px solid var(--border)}
.mh h3{font-size:1rem;font-weight:700}
.mc-x{width:30px;height:30px;border-radius:var(--r);background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:1.2rem;transition:.2s}
.mc-x:hover{border-color:var(--gold);color:var(--gold)}
.mb{padding:1.25rem;overflow-y:auto;flex:1}.mf{padding:.875rem 1.25rem;border-top:1px solid var(--border);display:flex;gap:.5rem}.mf .btn{flex:1}
.fg{margin-bottom:1rem}.fg label{display:block;font-size:.8125rem;color:var(--text2);margin-bottom:.375rem;font-weight:500}
.fg input,.fg select,.fg textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:.5rem .875rem;color:var(--text);font-size:.875rem;outline:none;font-family:inherit;transition:.2s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--gold)}
.fg textarea{resize:vertical;min-height:60px}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}

/* ─── Premium enhancements ─── */
@keyframes _pgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes _scIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes _flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.ph{animation:_pgIn .22s ease backwards}
.sc{animation:_scIn .28s ease backwards}
.sg>.sc:nth-child(1){animation-delay:.04s}
.sg>.sc:nth-child(2){animation-delay:.09s}
.sg>.sc:nth-child(3){animation-delay:.14s}
.sg>.sc:nth-child(4){animation-delay:.19s}
.card{animation:_pgIn .3s ease .08s backwards}
.tbl tbody tr:hover{background:rgba(34,197,94,.04)!important}
.bk:hover{transform:scale(1.05)}
.pb.active{box-shadow:0 2px 10px rgba(34,197,94,.15)}
.pager-btn.active{box-shadow:0 2px 8px rgba(34,197,94,.12)}
.search-wrap input:focus{box-shadow:0 0 0 2px rgba(34,197,94,.1)}
.empty svg{animation:_flt 3.5s ease-in-out infinite}
.modal.open .mc{animation:_scIn .2s ease}
.btn-gold:hover{transform:translateY(-1px)}
.btn-outline:hover{transform:translateY(-1px)}
</style>
<link rel="stylesheet" href="../styles/premium-overlay.css">
<!-- Mobil qatlam - ENG OXIRGI stil (faqat @media max-width ichida ishlaydi) -->
<link rel="stylesheet" href="../styles/mobile.css">
</head>
<body>
<div class="xa-atmos" aria-hidden="true"></div>
<header class="ph">
  <a href="pos.html" class="bk">←</a>
  <h1 class="ph-title">Bronlar</h1>
  <button class="btn btn-gold" id="addBtn">+ Yangi bron</button>
</header>
<div class="pc">
  <div class="toolbar">
    <div class="date-nav">
      <button onclick="shiftDay(-1)">‹</button>
      <span class="date-lbl" id="dateLbl"></span>
      <button onclick="shiftDay(1)">›</button>
    </div>
    <input type="date" class="date-inp" id="dateInp">
    <button class="btn btn-out btn-sm" onclick="goToday()">Bugun</button>
    <select class="fsel" id="stFilter">
      <option value="">Barcha holatlar</option>
      <option value="pending">Kutilmoqda</option>
      <option value="confirmed">Tasdiqlangan</option>
      <option value="completed">Yakunlangan</option>
      <option value="cancelled">Bekor</option>
    </select>
  </div>
  <div class="rlist" id="rlist"><div class="empty">Yuklanmoqda...</div></div>
</div>

<div class="modal" id="modal">
  <div class="mc">
    <div class="mh"><h3 id="mTitle">Yangi bron</h3><div class="mc-x" onclick="cm()">×</div></div>
    <div class="mb">
      <input type="hidden" id="eid">
      <div class="fr2">
        <div class="fg"><label>Mijoz ismi *</label><input id="eName" placeholder="Alisher Uzoqov"></div>
        <div class="fg"><label>Telefon *</label><input id="ePhone" placeholder="+998 90..." type="tel"></div>
      </div>
      <div class="fr2">
        <div class="fg"><label>Sana *</label><input id="eDate" type="date"></div>
        <div class="fg"><label>Vaqt *</label><input id="eTime" type="time"></div>
      </div>
      <div class="fr2">
        <div class="fg"><label>Stol *</label><select id="eTable"><option value="">Tanlang...</option></select></div>
        <div class="fg"><label>Mehmonlar soni</label><input id="eGuests" type="number" min="1" value="2"></div>
      </div>
      <div class="fg"><label>Davomiyligi (daqiqa)</label><input id="eDur" type="number" min="30" step="30" value="120"></div>
      <div class="fg"><label>Izoh</label><textarea id="eNote" placeholder="Qo'shimcha ma'lumot..."></textarea></div>
    </div>
    <div class="mf">
      <button class="btn btn-out" onclick="cm()">Bekor</button>
      <button class="btn btn-gold" id="saveBtn" onclick="save()">Saqlash</button>
    </div>
  </div>
</div>

<script>if(!localStorage.getItem('access_token')) location.href='../shared/login.html';</script>
<script type="module">
import { AuthGuard }       from '../js/core/auth-guard.js';
import { initErrorHandler } from '../js/core/error-handler.js';
AuthGuard.check();
initErrorHandler();
</script>
<script>
const _lport = window.location.port;
const _isDev = ['5500','5501','3000','4200','8080'].includes(_lport) && ['localhost','127.0.0.1'].includes(window.location.hostname);
const BASE=_isDev ? 'http://localhost:8000/api/v1' : ((window.XENORA_SERVER||'')+'/api/v1'),tok=()=>localStorage.getItem('access_token');
const api={
  get:u=>fetch(`${BASE}${u}`,{headers:{Authorization:'Bearer '+tok()}}).then(r=>r.json()),
  post:(u,b)=>fetch(`${BASE}${u}`,{method:'POST',headers:{'Authorization':'Bearer '+tok(),'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json()),
  patch:(u,b)=>fetch(`${BASE}${u}`,{method:'PATCH',headers:{'Authorization':'Bearer '+tok(),'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json()),
};
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
const ST_LBL={pending:'Kutilmoqda',confirmed:'Tasdiqlangan',completed:'Yakunlangan',cancelled:'Bekor'};
const ST_CL={pending:'b-pending',confirmed:'b-confirmed',completed:'b-completed',cancelled:'b-cancelled'};

let curDate=new Date().toISOString().split('T')[0],reservations=[],tables=[];
document.getElementById('dateInp').value=curDate;

async function load(){
  const [rRes,tRes]=await Promise.all([
    api.get(`/reservations?date=${curDate}&page_size=200`).catch(()=>null),
    api.get('/tables/all').catch(()=>null),
  ]);
  reservations=rRes?.items??(Array.isArray(rRes)?rRes:rRes?.data?.items??rRes?.data??[]);
  tables=tRes?.items??(Array.isArray(tRes)?tRes:tRes?.data??[]);
  const tsel=document.getElementById('eTable');
  tsel.innerHTML='<option value="">Tanlang...</option>'+tables.map(t=>`<option value="${t.id}">Stol #${t.number||t.name} (${t.capacity} kishi)</option>`).join('');
  render();
}

function render(){
  const st=document.getElementById('stFilter').value;
  let list=reservations;
  if(st) list=list.filter(r=>r.status===st);
  list=[...list].sort((a,b)=>(a.reservation_time||'').localeCompare(b.reservation_time||''));
  const el=document.getElementById('rlist');
  if(!list.length){el.innerHTML='<div class="empty">Bronlar topilmadi</div>';return;}
  el.innerHTML=list.map(r=>{
    const time=(r.reservation_time||'').substring(11,16)||'—';
    const tbl=tables.find(t=>t.id===r.table_id);
    const name=r.customer_name||r.customer?.name||'—';
    const phone=r.customer_phone||r.customer?.phone||'';
    return `<div class="rcard ${r.status}">
      <div class="rtime"><div class="hr">${time}</div><div class="dur">${r.duration_minutes||120} min</div></div>
      <div class="rinfo">
        <div class="rname">${esc(name)}</div>
        <div class="rmeta">${phone?esc(phone)+' • ':''}${r.guests_count||1} kishi${tbl?' • Stol #'+(tbl.number||tbl.name):''}</div>
        ${r.notes?`<div class="rnote">${esc(r.notes)}</div>`:''}
      </div>
      <div class="racts">
        <span class="badge ${ST_CL[r.status]||''}">${ST_LBL[r.status]||r.status}</span>
        ${r.status==='pending'?`<button class="btn btn-gold btn-sm" onclick="upd(${r.id},'confirmed')">Tasdiqlash</button>`:''}
        ${r.status!=='cancelled'&&r.status!=='completed'?`<button class="btn btn-out btn-sm" onclick="upd(${r.id},'cancelled')">Bekor</button>`:''}
      </div>
    </div>`;
  }).join('');
}

async function upd(id,status){
  await api.patch(`/reservations/${id}/status`,{status}).catch(()=>null);
  showT('Holat yangilandi','success');load();
}

function updateDateLabel(){const d=new Date(curDate);const today=new Date().toISOString().split('T')[0];document.getElementById('dateLbl').textContent=curDate===today?'Bugun':d.toLocaleDateString('uz-UZ',{day:'2-digit',month:'2-digit',year:'numeric'});}
function shiftDay(n){const d=new Date(curDate);d.setDate(d.getDate()+n);curDate=d.toISOString().split('T')[0];document.getElementById('dateInp').value=curDate;updateDateLabel();load();}
function goToday(){curDate=new Date().toISOString().split('T')[0];document.getElementById('dateInp').value=curDate;updateDateLabel();load();}
document.getElementById('dateInp').addEventListener('change',e=>{curDate=e.target.value;updateDateLabel();load();});
document.getElementById('stFilter').addEventListener('change',render);

function om(){document.getElementById('modal').classList.add('open');}
function cm(){document.getElementById('modal').classList.remove('open');}

function openAdd(){
  document.getElementById('mTitle').textContent='Yangi bron';
  document.getElementById('eid').value='';
  ['eName','ePhone','eNote'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('eTable').value='';
  document.getElementById('eDate').value=curDate;
  document.getElementById('eTime').value='';
  document.getElementById('eGuests').value=2;
  document.getElementById('eDur').value=120;
  om();
}

async function save(){
  const name=document.getElementById('eName').value.trim();
  const phone=document.getElementById('ePhone').value.trim();
  const date=document.getElementById('eDate').value;
  const time=document.getElementById('eTime').value;
  const tableId=parseInt(document.getElementById('eTable').value)||0;
  if(!name||!phone||!date||!time||!tableId){showT('Barcha * maydonlar majburiy','warning');return;}
  const body={customer_name:name,customer_phone:phone,table_id:tableId,reservation_time:date+'T'+time+':00',guests_count:parseInt(document.getElementById('eGuests').value)||2,duration_minutes:parseInt(document.getElementById('eDur').value)||120,notes:document.getElementById('eNote').value||null};
  const btn=document.getElementById('saveBtn');btn.disabled=true;btn.textContent='...';
  try{
    await api.post('/reservations',body);
    showT('Bron yaratildi','success');cm();load();
  }catch{showT('Xatolik','error');}
  finally{btn.disabled=false;btn.textContent='Saqlash';}
}

function showT(m,t='info'){const c={success:'#22c55e',error:'#ef4444',warning:'#f59e0b'};const el=document.createElement('div');el.style.cssText=`position:fixed;bottom:1.5rem;right:1.5rem;z-index:9999;background:var(--bg2);border:1px solid ${c[t]};color:${c[t]};padding:.625rem 1.125rem;border-radius:.5rem;font-size:.875rem;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.4)`;el.textContent=m;document.body.appendChild(el);setTimeout(()=>el.remove(),3000);}

document.getElementById('addBtn').addEventListener('click',openAdd);
document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))cm();});
updateDateLabel();
load();
</script>
</body>
</html>
