<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
<script>/*XENORA_SERVER_CAP*/if(window.Capacitor&&!window.XENORA_SERVER)window.XENORA_SERVER='http://146.190.225.168';</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mijoz Ekrani — XENORA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#d4b46c;--gold-dim:rgba(34,197,94,.15);
  --bg:#070f1e;--bg2:#0a1628;--bg3:#0f2038;
  --border:rgba(34,197,94,.18);--border2:rgba(255,255,255,.08);
  --text:#e8eef5;--text2:#8b9bb0;--text3:#6b7d94;
  --success:#22c55e;--danger:#ef4444;
}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}

/* ── Header ── */
.cd-header{
  background:var(--bg2);border-bottom:1px solid var(--border);
  padding:1.25rem 2rem;display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.cd-brand{font-size:1.5rem;font-weight:800;color:var(--gold);letter-spacing:.05em}
.cd-subtitle{font-size:.875rem;color:var(--text2);margin-top:.125rem}
.cd-time{font-family:'JetBrains Mono',monospace;font-size:1.25rem;color:var(--text2);font-weight:500}

/* ── Cart area ── */
.cd-body{flex:1;display:flex;gap:0;overflow:hidden}

.cd-items{flex:1;padding:1.5rem 2rem;overflow-y:auto;border-right:1px solid var(--border2)}
.cd-items-title{font-size:.75rem;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:1rem}

.cd-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:.875rem 1rem;margin-bottom:.5rem;
  background:var(--bg2);border:1px solid var(--border2);border-radius:.75rem;
  transition:all .2s;
}
.cd-item.highlight{border-color:var(--gold);background:rgba(34,197,94,.06)}
.cd-item-name{font-size:1rem;font-weight:600;flex:1}
.cd-item-meta{font-size:.8125rem;color:var(--text2);margin-top:.1rem}
.cd-item-qty{font-family:'JetBrains Mono',monospace;font-size:.9375rem;font-weight:600;color:var(--text2);padding:0 1.25rem;text-align:center;white-space:nowrap}
.cd-item-price{font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:700;color:var(--gold);min-width:120px;text-align:right;white-space:nowrap}

/* ── Empty state ── */
.cd-empty{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:3rem;color:var(--text3);
}
.cd-empty-icon{font-size:5rem;margin-bottom:1.5rem;opacity:.4}
.cd-empty-txt{font-size:1.25rem;font-weight:600}
.cd-empty-sub{font-size:.9375rem;color:var(--text3);margin-top:.5rem}

/* ── Totals panel ── */
.cd-totals{
  width:340px;flex-shrink:0;padding:1.5rem;
  background:var(--bg2);display:flex;flex-direction:column;gap:.875rem;
}
.cd-total-row{display:flex;justify-content:space-between;align-items:center}
.cd-total-lbl{font-size:.9375rem;color:var(--text2)}
.cd-total-val{font-family:'JetBrains Mono',monospace;font-size:.9375rem;font-weight:600}
.cd-total-row.grand{
  margin-top:auto;padding-top:1.25rem;border-top:1px solid var(--border);
}
.cd-total-row.grand .cd-total-lbl{font-size:1.1rem;font-weight:700;color:var(--text)}
.cd-total-row.grand .cd-total-val{font-size:1.75rem;font-weight:800;color:var(--gold)}
.cd-disc-row{display:none}

/* ── Payment complete overlay ── */
.cd-paid-overlay{
  position:fixed;inset:0;background:rgba(10,10,15,.92);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:100;opacity:0;pointer-events:none;transition:opacity .4s;
}
.cd-paid-overlay.show{opacity:1;pointer-events:auto}
.cd-paid-icon{font-size:7rem;margin-bottom:1.5rem;animation:bounceIn .5s}
.cd-paid-title{font-size:2.5rem;font-weight:800;color:var(--success);margin-bottom:.5rem}
.cd-paid-sub{font-size:1.25rem;color:var(--text2)}

@keyframes bounceIn{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.15)}80%{transform:scale(.95)}100%{transform:scale(1);opacity:1}}

/* ── Welcome screen ── */
.cd-welcome{
  position:fixed;inset:0;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1.5rem;z-index:50;
}
.cd-welcome-logo{font-size:3.5rem;font-weight:800;color:var(--gold);letter-spacing:.1em}
.cd-welcome-sub{font-size:1.125rem;color:var(--text2)}
.cd-welcome-hint{font-size:.875rem;color:var(--text3);text-align:center;max-width:400px;line-height:1.6}

/* ─── Premium enhancements ─── */
@keyframes _pgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes _scIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes _flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.ph{animation:_pgIn .22s ease backwards}
.sc{animation:_scIn .28s ease backwards}
.sg>.sc:nth-child(1){animation-delay:.04s}
.sg>.sc:nth-child(2){animation-delay:.09s}
.sg>.sc:nth-child(3){animation-delay:.14s}
.sg>.sc:nth-child(4){animation-delay:.19s}
.card{animation:_pgIn .3s ease .08s backwards}
.tbl tbody tr:hover{background:rgba(34,197,94,.04)!important}
.bk:hover{transform:scale(1.05)}
.pb.active{box-shadow:0 2px 10px rgba(34,197,94,.15)}
.pager-btn.active{box-shadow:0 2px 8px rgba(34,197,94,.12)}
.search-wrap input:focus{box-shadow:0 0 0 2px rgba(34,197,94,.1)}
.empty svg{animation:_flt 3.5s ease-in-out infinite}
.modal.open .mc{animation:_scIn .2s ease}
.btn-gold:hover{transform:translateY(-1px)}
.btn-outline:hover{transform:translateY(-1px)}
</style>
<link rel="stylesheet" href="../styles/premium-overlay.css">
</head>
<body>
<div class="xa-atmos" aria-hidden="true"></div>

<!-- Welcome screen (shown until first cart message arrives) -->
<div class="cd-welcome" id="welcomeScreen">
  <div class="cd-welcome-logo">XENORA</div>
  <div class="cd-welcome-sub">Xush kelibsiz!</div>
  <div class="cd-welcome-hint">Mijoz ekrani tayyor. Kassir mahsulotni tanlashi bilan bu yerda ko'rinadi.</div>
</div>

<!-- Payment complete overlay -->
<div class="cd-paid-overlay" id="paidOverlay">
  <div class="cd-paid-icon">✅</div>
  <div class="cd-paid-title">To'lov qabul qilindi!</div>
  <div class="cd-paid-sub">Xarid uchun rahmat!</div>
</div>

<!-- Header -->
<div class="cd-header">
  <div>
    <div class="cd-brand" id="cdBrand">XENORA</div>
    <div class="cd-subtitle" id="cdSubtitle">Sifatli xizmat kafolati</div>
  </div>
  <div class="cd-time" id="cdClock">00:00</div>
</div>

<!-- Body -->
<div class="cd-body">
  <!-- Items -->
  <div class="cd-items" id="cdItemsWrap">
    <div class="cd-empty" id="cdEmpty">
      <div class="cd-empty-icon">🛒</div>
      <div class="cd-empty-txt">Savat bo'sh</div>
      <div class="cd-empty-sub">Mahsulot tanlanganda bu yerda ko'rinadi</div>
    </div>
    <div id="cdItemsList" style="display:none">
      <div class="cd-items-title">Buyurtma tarkibi</div>
      <div id="cdItems"></div>
    </div>
  </div>

  <!-- Totals -->
  <div class="cd-totals" id="cdTotals">
    <div class="cd-total-row cd-disc-row" id="cdDiscRow">
      <span class="cd-total-lbl">Chegirma</span>
      <span class="cd-total-val" id="cdDisc" style="color:var(--success)">0</span>
    </div>
    <div class="cd-total-row" id="cdTaxRow">
      <span class="cd-total-lbl">Soliq (12%)</span>
      <span class="cd-total-val" id="cdTax">0</span>
    </div>
    <div class="cd-total-row" id="cdSvcRow">
      <span class="cd-total-lbl">Xizmat (10%)</span>
      <span class="cd-total-val" id="cdSvc">0</span>
    </div>
    <div class="cd-total-row grand">
      <span class="cd-total-lbl">JAMI</span>
      <span class="cd-total-val" id="cdTotal">0 UZS</span>
    </div>
  </div>
</div>

<script>
(function () {
  const channel = ('BroadcastChannel' in window) ? new BroadcastChannel('restopos_customer_display') : null;
  let _paidTimer = null;

  function fmt(n) { return Math.round(n).toLocaleString('uz-UZ') + ' UZS'; }

  // Clock
  function tickClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    document.getElementById('cdClock').textContent = `${h}:${m}`;
  }
  tickClock();
  setInterval(tickClock, 10000);

  function showCart(data) {
    document.getElementById('welcomeScreen').style.display = 'none';
    const { cart = [], totals = {}, businessName } = data;
    if (businessName) document.getElementById('cdBrand').textContent = businessName;

    const empty    = document.getElementById('cdEmpty');
    const listWrap = document.getElementById('cdItemsList');
    const items    = document.getElementById('cdItems');

    if (!cart.length) {
      empty.style.display    = '';
      listWrap.style.display = 'none';
    } else {
      empty.style.display    = 'none';
      listWrap.style.display = '';
      items.innerHTML = cart.map((item, i) => {
        const lineTotal = Math.round(item.price * item.qty);
        const isLast    = i === cart.length - 1;
        const unit      = item._unit && item._unit !== 'pcs' ? ' / ' + item._unit : '';
        return `
          <div class="cd-item ${isLast ? 'highlight' : ''}">
            <div style="flex:1">
              <div class="cd-item-name">${item.name}</div>
              ${unit ? `<div class="cd-item-meta">${Math.round(item.price).toLocaleString('uz-UZ')} UZS${unit}</div>` : ''}
            </div>
            <div class="cd-item-qty">× ${item.qty}</div>
            <div class="cd-item-price">${lineTotal.toLocaleString('uz-UZ')} UZS</div>
          </div>`;
      }).join('');
    }

    // Totals
    const { sub=0, disc=0, tax=0, service=0, total=0 } = totals;
    const discRow = document.getElementById('cdDiscRow');
    const taxRow  = document.getElementById('cdTaxRow');
    const svcRow  = document.getElementById('cdSvcRow');
    discRow.style.display = disc > 0 ? 'flex' : 'none';
    taxRow.style.display  = tax  > 0 ? 'flex' : 'none';
    svcRow.style.display  = service > 0 ? 'flex' : 'none';
    document.getElementById('cdDisc').textContent  = '-' + fmt(disc);
    document.getElementById('cdTax').textContent   = fmt(tax);
    document.getElementById('cdSvc').textContent   = fmt(service);
    document.getElementById('cdTotal').textContent = fmt(total);
  }

  function showPaymentComplete() {
    const overlay = document.getElementById('paidOverlay');
    overlay.classList.add('show');
    clearTimeout(_paidTimer);
    _paidTimer = setTimeout(() => {
      overlay.classList.remove('show');
      // Clear cart display after payment
      showCart({ cart: [], totals: {} });
    }, 4000);
  }

  if (channel) {
    channel.onmessage = function (e) {
      const data = e.data || {};
      if (data.type === 'cart_update')      showCart(data);
      if (data.type === 'payment_complete') showPaymentComplete();
    };
  } else {
    // BroadcastChannel not supported — show notice
    document.getElementById('cdSubtitle').textContent = 'BroadcastChannel qo\'llab-quvvatlanmaydi (Chrome/Edge kerak)';
  }
})();
</script>
</body>
</html>
