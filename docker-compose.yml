version: '3.9'

services:

  db:
    image: postgres:15-alpine
    container_name: restopos_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: restaurant_pos
      POSTGRES_USER: pos_user
      POSTGRES_PASSWORD: pos_pass123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos_user -d restaurant_pos"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: restopos_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://pos_user:pos_pass123@db:5432/restaurant_pos
      ENVIRONMENT: production
      DEBUG: "False"
      BACKEND_CORS_ORIGINS: '["http://localhost","http://localhost:80","https://localhost"]'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/static/uploads
      - ./backend/logs:/app/logs
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:1.25-alpine
    container_name: restopos_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend:/usr/share/nginx/html:ro
      - uploads_data:/usr/share/nginx/html/uploads:ro
      # Let's Encrypt sertifikatlari (ssl-init dan keyin paydo bo'ladi)
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy

  # ─── Let's Encrypt certbot (faqat SSL kerak bo'lganda) ────────────────────
  # Ishlatish: make ssl-init domenName=your.domain.com email=admin@your.domain.com
  # Keyin: make ssl-renew (yoki cron orqali avtomatik)
  certbot:
    image: certbot/certbot:latest
    container_name: restopos_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    # Default holatda o'z-o'zidan chiqib ketadi (faqat buyruq berganda ishlaydi)
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"
    profiles:
      - ssl

volumes:
  postgres_data:
  uploads_data:
  certbot_www:
  certbot_conf:
