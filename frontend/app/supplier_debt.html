<!DOCTYPE html>
<html lang="uz">
<head>
<script>/*XENORA_SERVER_CAP*/if(window.Capacitor&&!window.XENORA_SERVER)window.XENORA_SERVER='http://146.190.225.168';</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firmaga Qarz — XENORA</title>
<link rel="stylesheet" href="../css/main.css">
<style>
/* SELF-CONTAINED tema - /css/main.css YO'Q (404). Orphaned --var (zumrad-tilla). */
:root{--surface1:#0a1628;--surface2:#0f2038;--surface3:#16294a;--text1:#e8eef5;--text2:#8b9bb0;--text3:#6b7d94;--primary:#0d9488;--accent:#22c55e;--border:rgba(34,197,94,.18);--bg:#070f1e;}
[data-theme="light"]{--surface1:#ffffff;--surface2:#eef2f9;--surface3:#e6ecf6;--text1:#0f2038;--text2:#5a6b82;--text3:#677689;--primary:#0a7d72;--accent:#0a7d72;--border:rgba(0,0,0,.1);--bg:#f4f6fb;}
body{font-family:'Inter',system-ui,sans-serif;color:var(--text1)}
.layout{display:flex;min-height:100vh}.main-content{flex:1;min-width:0;padding:1.5rem;max-width:1180px;margin:0 auto;width:100%}
.btn{display:inline-flex;align-items:center;gap:.375rem;padding:.5rem 1.1rem;border-radius:.5rem;font-size:.875rem;font-weight:600;cursor:pointer;border:1px solid transparent;background:linear-gradient(135deg,#16a34a,#22c55e,#16a34a);color:#04160d;font-family:inherit;transition:.2s}
.btn:hover{box-shadow:0 0 16px rgba(34,197,94,.35);transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.btn.btn-secondary,.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text2)}
.inp,input,select,textarea{background:var(--surface2);border:1px solid var(--border);border-radius:.5rem;padding:.5rem .75rem;color:var(--text1);font-size:.875rem;outline:none;font-family:inherit}
</style>
<style>
  .page-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.5rem; }
  .page-title  { font-size:1.25rem; font-weight:700; }
  .debt-grid   { display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:1.25rem; margin-bottom:2rem; }
  .debt-card   { background:var(--surface1); border:2px solid var(--border); border-radius:.875rem; padding:1.25rem; }
  .debt-card.overdue { border-color:#ef4444; }
  .card-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:1rem; }
  .firm-name   { font-weight:700; font-size:1rem; color:var(--text1); }
  .firm-meta   { font-size:.8125rem; color:var(--text3); margin-top:.125rem; }
  .debt-amount { text-align:right; }
  .debt-num    { font-size:1.375rem; font-weight:800; color:var(--accent); }
  .debt-num.red{ color:#ef4444; }
  .overdue-tag { font-size:.6875rem; font-weight:700; background:#fee2e2; color:#991b1b; border-radius:.375rem; padding:.15rem .4rem; }
  .progress-row { display:flex; align-items:center; gap:.625rem; margin-bottom:.625rem; }
  .progress-bar { flex:1; height:6px; background:var(--surface3); border-radius:3px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--accent); border-radius:3px; }
  .progress-fill.red { background:#ef4444; }
  .stats-row   { display:flex; gap:1rem; font-size:.8125rem; color:var(--text2); flex-wrap:wrap; }
  .stat-item   { display:flex; flex-direction:column; }
  .stat-label  { font-size:.6875rem; color:var(--text3); }
  .stat-val    { font-weight:600; }
  .btn-row     { display:flex; gap:.5rem; margin-top:1rem; }
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:999; align-items:center; justify-content:center; }
  .modal-overlay.active { display:flex; }
  .modal-box  { background:var(--surface1); border-radius:1rem; padding:1.5rem; max-width:500px; width:94%; }
  .modal-title{ font-size:1.125rem; font-weight:700; margin-bottom:1.25rem; }
  .form-row   { margin-bottom:.875rem; }
  .form-label { font-size:.8125rem; color:var(--text2); margin-bottom:.375rem; display:block; }
  .form-grid  { display:grid; grid-template-columns:1fr 1fr; gap:.75rem; }
  .tab-bar    { display:flex; border-bottom:2px solid var(--border); margin-bottom:1.5rem; }
  .tab-btn    { padding:.625rem 1.25rem; cursor:pointer; background:none; border:none; color:var(--text2);
                font-size:.9375rem; font-weight:600; border-bottom:3px solid transparent; margin-bottom:-2px; }
  .tab-btn.active { color:var(--accent); border-bottom-color:var(--accent); }
  .history-row { display:flex; justify-content:space-between; padding:.5rem .75rem; border-radius:.5rem;
                 font-size:.875rem; margin-bottom:.25rem; }
  .history-row:hover { background:var(--surface2); }
  .pay-positive { color:#22c55e; }
  .pay-return   { color:#f59e0b; }
</style>
<link rel="stylesheet" href="../styles/premium-overlay.css">
</head>
<body>
<div class="xa-atmos" aria-hidden="true"></div>
<div class="layout">
  <div id="sidebar-container"></div>
  <main class="main-content">
    <a href="admin.html" style="display:inline-block;margin-bottom:1rem;color:var(--text2);text-decoration:none;font-size:.875rem">← Admin panel</a>
    <div class="page-header">
      <h1 class="page-title">💳 Firmaga Qarz / Oldi-Berdi</h1>
      <div style="display:flex;gap:.75rem">
        <button class="btn btn-secondary" id="btnReturn">↩ Vozvrat</button>
        <button class="btn" id="btnPay">+ To'lov</button>
      </div>
    </div>

    <div class="tab-bar">
      <button class="tab-btn active" id="tabDebt" onclick="showTab('debt')">Qarzlar</button>
      <button class="tab-btn" id="tabHistory" onclick="showTab('history')">To'lovlar tarixi</button>
    </div>

    <!-- Qarzlar -->
    <div id="panelDebt">
      <div class="debt-grid" id="debtGrid">
        <div style="text-align:center;padding:2rem;color:var(--text3)">Yuklanmoqda...</div>
      </div>
    </div>

    <!-- Tarix -->
    <div id="panelHistory" style="display:none">
      <div style="display:flex;gap:.75rem;margin-bottom:1rem;align-items:flex-end;flex-wrap:wrap">
        <div>
          <label style="font-size:.8125rem;color:var(--text2);display:block;margin-bottom:.25rem">Firma</label>
          <select class="inp" id="histSup" style="width:200px" onchange="loadHistory()">
            <option value="">Barcha firmalar</option>
          </select>
        </div>
        <div>
          <label style="font-size:.8125rem;color:var(--text2);display:block;margin-bottom:.25rem">Dan</label>
          <input type="date" class="inp" id="histFrom" style="width:145px" onchange="loadHistory()">
        </div>
        <div>
          <label style="font-size:.8125rem;color:var(--text2);display:block;margin-bottom:.25rem">Gacha</label>
          <input type="date" class="inp" id="histTo" style="width:145px" onchange="loadHistory()">
        </div>
      </div>
      <div id="historyList"></div>
    </div>
  </main>
</div>

<!-- To'lov modali -->
<div class="modal-overlay" id="payModal">
  <div class="modal-box">
    <div class="modal-title">Firmaga to'lov</div>
    <div class="form-row">
      <label class="form-label">Firma *</label>
      <select class="inp" id="paySupplier"></select>
    </div>
    <div class="form-row">
      <label class="form-label">Nakladnoy (ixtiyoriy)</label>
      <select class="inp" id="payReceipt">
        <option value="">Umumiy to'lov</option>
      </select>
    </div>
    <div class="form-grid">
      <div class="form-row">
        <label class="form-label">Miqdor (UZS) *</label>
        <input type="number" class="inp" id="payAmount" placeholder="0" min="1">
      </div>
      <div class="form-row">
        <label class="form-label">Sana *</label>
        <input type="date" class="inp" id="payDate">
      </div>
    </div>
    <div class="form-row">
      <label class="form-label">To'lov usuli</label>
      <select class="inp" id="payMethod">
        <option value="cash">Naqd</option>
        <option value="transfer">Bank o'tkazma</option>
        <option value="card">Karta</option>
      </select>
    </div>
    <div class="form-row">
      <label class="form-label">Izoh</label>
      <input type="text" class="inp" id="payNotes" placeholder="Ixtiyoriy...">
    </div>
    <div style="display:flex;gap:.75rem;justify-content:flex-end;margin-top:1.25rem">
      <button class="btn btn-secondary" onclick="closePayModal()">Bekor</button>
      <button class="btn" id="btnPaySave" onclick="savePay()">To'lov qilish</button>
    </div>
  </div>
</div>

<!-- Vozvrat modali -->
<div class="modal-overlay" id="returnModal">
  <div class="modal-box">
    <div class="modal-title">Firmaga Vozvrat</div>
    <div class="form-row">
      <label class="form-label">Firma *</label>
      <select class="inp" id="retSupplier"></select>
    </div>
    <div class="form-row">
      <label class="form-label">Mahsulot *</label>
      <select class="inp" id="retProduct"></select>
    </div>
    <div class="form-grid">
      <div class="form-row">
        <label class="form-label">Miqdor *</label>
        <input type="number" class="inp" id="retQty" placeholder="0" min="0.001" step="0.001">
      </div>
      <div class="form-row">
        <label class="form-label">Birlik narxi *</label>
        <input type="number" class="inp" id="retPrice" placeholder="0" min="0">
      </div>
    </div>
    <div class="form-grid">
      <div class="form-row">
        <label class="form-label">Sana *</label>
        <input type="date" class="inp" id="retDate">
      </div>
      <div class="form-row">
        <label class="form-label">Sabab</label>
        <select class="inp" id="retReason">
          <option value="brak">Brak/Yaroqsiz</option>
          <option value="expired">Muddati tugagan</option>
          <option value="wrong_item">Noto'g'ri tovar</option>
          <option value="other">Boshqa</option>
        </select>
      </div>
    </div>
    <div style="display:flex;gap:.75rem;justify-content:flex-end;margin-top:1.25rem">
      <button class="btn btn-secondary" onclick="closeRetModal()">Bekor</button>
      <button class="btn" id="btnRetSave" onclick="saveRet()">Qaytarish</button>
    </div>
  </div>
</div>

<script type="module">
import { Sidebar } from '../js/core/sidebar.js';
import { API } from '../js/core/api.js';
Sidebar.init();
const api = new API();
let suppliers = [];
let products  = [];

async function init() {
  const today = new Date().toISOString().slice(0,10);
  document.getElementById('payDate').value  = today;
  document.getElementById('retDate').value  = today;
  document.getElementById('histFrom').value = today.slice(0,7)+'-01';
  document.getElementById('histTo').value   = today;

  const [supRes, prodRes] = await Promise.all([
    api.get('/suppliers-b2b/?page_size=200&is_active=true'),
    api.get('/products/?page_size=500'),
  ]);
  suppliers = supRes.items || [];
  products  = prodRes.items || [];

  const supOpts = suppliers.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
  ['paySupplier','retSupplier','histSup'].forEach(id => {
    const el = document.getElementById(id);
    if (el.id === 'histSup') {
      el.insertAdjacentHTML('beforeend', supOpts);
    } else {
      el.innerHTML = supOpts;
    }
  });
  document.getElementById('retProduct').innerHTML = products.map(p =>
    `<option value="${p.id}" data-price="${p.price||0}">${p.name}</option>`
  ).join('');
  document.getElementById('retProduct').onchange = function() {
    const opt = this.options[this.selectedIndex];
    document.getElementById('retPrice').value = opt.dataset.price || '';
  };

  document.getElementById('paySupplier').onchange = loadReceipts;
  loadDebt();
}

async function loadReceipts() {
  const supId = document.getElementById('paySupplier').value;
  const sel   = document.getElementById('payReceipt');
  sel.innerHTML = '<option value="">Umumiy to\'lov</option>';
  if (!supId) return;
  const res = await api.get(`/purchase-receipts/?supplier_id=${supId}&status=confirmed&page_size=50`);
  (res.items||[]).forEach(r => {
    sel.insertAdjacentHTML('beforeend', `<option value="${r.id}">#${r.id} ${r.invoice_number||''} — ${fmt(r.net_amount)} so'm (${r.receipt_date})</option>`);
  });
}

async function loadDebt() {
  const res = await api.get('/suppliers-b2b/debt-summary');
  const grid = document.getElementById('debtGrid');
  if (!Array.isArray(res) || !res.length) {
    grid.innerHTML = '<div style="color:var(--text3);text-align:center;padding:2rem">Firmalar topilmadi</div>';
    return;
  }
  grid.innerHTML = res.map(d => {
    const pct     = d.total_purchases > 0 ? Math.min(100, d.total_paid / d.total_purchases * 100) : 100;
    const overdue = d.overdue_amount > 0;
    return `
      <div class="debt-card ${overdue ? 'overdue':''}">
        <div class="card-header">
          <div>
            <div class="firm-name">${d.supplier_name} ${overdue ? '<span class="overdue-tag">⚠ Muddati o\'tgan</span>' : ''}</div>
            <div class="firm-meta">${d.phone || ''} ${d.last_purchase ? '| Oxirgi: '+d.last_purchase : ''}</div>
          </div>
          <div class="debt-amount">
            <div class="debt-num ${d.debt>0 ? 'red':''}">${fmt(d.debt)}</div>
            <div style="font-size:.75rem;color:var(--text3)">so'm qarz</div>
          </div>
        </div>
        <div class="progress-row">
          <span style="font-size:.75rem;color:var(--text3)">To'langan</span>
          <div class="progress-bar"><div class="progress-fill ${overdue?'red':''}" style="width:${pct}%"></div></div>
          <span style="font-size:.75rem;font-weight:700">${pct.toFixed(0)}%</span>
        </div>
        <div class="stats-row">
          <div class="stat-item"><span class="stat-label">Jami xarid</span><span class="stat-val">${fmt(d.total_purchases)}</span></div>
          <div class="stat-item"><span class="stat-label">To'langan</span><span class="stat-val" style="color:#22c55e">${fmt(d.total_paid)}</span></div>
          <div class="stat-item"><span class="stat-label">Qaytarilgan</span><span class="stat-val" style="color:#f59e0b">${fmt(d.total_returned)}</span></div>
          ${overdue ? `<div class="stat-item"><span class="stat-label">Muddati o'tgan</span><span class="stat-val" style="color:#ef4444">${fmt(d.overdue_amount)}</span></div>` : ''}
        </div>
        <div class="btn-row">
          <button class="btn btn-secondary" style="font-size:.8125rem;padding:.3rem .75rem"
            onclick="openPay(${d.supplier_id})">To'lov qilish</button>
          <button class="btn btn-secondary" style="font-size:.8125rem;padding:.3rem .75rem"
            onclick="openRet(${d.supplier_id})">Vozvrat</button>
        </div>
      </div>`;
  }).join('');
}

window.loadHistory = async () => {
  const params = new URLSearchParams({ page_size: 100 });
  const sup  = document.getElementById('histSup').value;
  const from = document.getElementById('histFrom').value;
  const to   = document.getElementById('histTo').value;
  if (sup)  params.set('supplier_id', sup);
  if (from) params.set('date_from', from);
  if (to)   params.set('date_to', to);
  const res = await api.get(`/supplier-payments/?${params}`);
  const list = document.getElementById('historyList');
  const rows = res.items || [];
  if (!rows.length) { list.innerHTML = '<div style="color:var(--text3);text-align:center;padding:2rem">To\'lovlar topilmadi</div>'; return; }
  list.innerHTML = rows.map(p => {
    const sup = suppliers.find(s => s.id === p.supplier_id);
    return `<div class="history-row">
      <span style="font-weight:600">${sup?.name || 'Firma #'+p.supplier_id}</span>
      <span style="color:var(--text2);font-size:.8125rem">${p.payment_date || ''} · ${methodLabel(p.payment_method)}</span>
      <span class="pay-positive" style="font-weight:700">+${fmt(p.amount)}</span>
    </div>`;
  }).join('');
};

window.showTab = (tab) => {
  document.getElementById('tabDebt').classList.toggle('active', tab==='debt');
  document.getElementById('tabHistory').classList.toggle('active', tab==='history');
  document.getElementById('panelDebt').style.display    = tab==='debt' ? '' : 'none';
  document.getElementById('panelHistory').style.display = tab==='history' ? '' : 'none';
  if (tab==='history') loadHistory();
};

window.openPay = (supplierId) => {
  document.getElementById('paySupplier').value = supplierId;
  loadReceipts();
  document.getElementById('payModal').classList.add('active');
};
document.getElementById('btnPay').onclick = () => {
  document.getElementById('paySupplier').value = suppliers[0]?.id || '';
  loadReceipts();
  document.getElementById('payModal').classList.add('active');
};
window.closePayModal = () => document.getElementById('payModal').classList.remove('active');
document.getElementById('payModal').onclick = e => { if(e.target===e.currentTarget) closePayModal(); };

window.savePay = async () => {
  const supId  = document.getElementById('paySupplier').value;
  const amount = parseFloat(document.getElementById('payAmount').value);
  const date   = document.getElementById('payDate').value;
  if (!supId || !amount || !date) { showToast('Firma, miqdor va sana kiritilsin', 'error'); return; }
  const btn = document.getElementById('btnPaySave');
  btn.disabled = true;
  const recId = document.getElementById('payReceipt').value;
  const res = await api.post('/supplier-payments/', {
    supplier_id:    parseInt(supId),
    receipt_id:     recId ? parseInt(recId) : null,
    amount,
    payment_date:   date,
    payment_method: document.getElementById('payMethod').value,
    notes:          document.getElementById('payNotes').value.trim() || null,
  });
  btn.disabled = false;
  if (res.id) {
    showToast('To\'lov saqlandi', 'success');
    closePayModal();
    document.getElementById('payAmount').value = '';
    loadDebt();
  } else {
    showToast(res.detail || 'Xatolik', 'error');
  }
};

window.openRet = (supplierId) => {
  document.getElementById('retSupplier').value = supplierId;
  document.getElementById('returnModal').classList.add('active');
};
document.getElementById('btnReturn').onclick = () => document.getElementById('returnModal').classList.add('active');
window.closeRetModal = () => document.getElementById('returnModal').classList.remove('active');
document.getElementById('returnModal').onclick = e => { if(e.target===e.currentTarget) closeRetModal(); };

window.saveRet = async () => {
  const supId = document.getElementById('retSupplier').value;
  const prodId= document.getElementById('retProduct').value;
  const qty   = parseFloat(document.getElementById('retQty').value);
  const price = parseFloat(document.getElementById('retPrice').value);
  const date  = document.getElementById('retDate').value;
  if (!supId || !prodId || !qty || !price || !date) { showToast("Barcha maydonlarni to'ldiring", 'error'); return; }
  const btn = document.getElementById('btnRetSave');
  btn.disabled = true;
  const res = await api.post('/supplier-returns/', {
    supplier_id: parseInt(supId),
    product_id:  parseInt(prodId),
    quantity: qty, unit_price: price, return_date: date,
    reason: document.getElementById('retReason').value,
  });
  btn.disabled = false;
  if (res.id) {
    showToast('Vozvrat saqlandi', 'success');
    closeRetModal();
    document.getElementById('retQty').value = '';
    loadDebt();
  } else {
    showToast(res.detail || 'Xatolik', 'error');
  }
};

function methodLabel(m) {
  return m==='cash'?'Naqd':m==='transfer'?"Bank o'tkazma":m==='card'?'Karta':m;
}
function fmt(n) { return Number(n||0).toLocaleString('uz-UZ'); }

function showToast(msg, type='info') {
  const el = document.createElement('div');
  el.style.cssText = `position:fixed;bottom:1.5rem;right:1.5rem;z-index:9999;padding:.75rem 1.25rem;border-radius:.625rem;color:#fff;background:${type==='success'?'#22c55e':type==='error'?'#ef4444':'#3b82f6'};font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.3)`;
  el.textContent = msg; document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

init();
</script>
</body>
</html>
