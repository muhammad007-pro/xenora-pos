<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XENORA - Yuklanmoqda</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Sora', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(ellipse 130% 90% at 50% -12%, #0d1c33 0%, #0a1628 46%, #070f1e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e8eef5;
            overflow: hidden;
        }

        /* koshin girih atmosfera — juda nozik */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
              linear-gradient(rgba(34,197,94,.035) 1px, transparent 1px),
              linear-gradient(90deg, rgba(34,197,94,.035) 1px, transparent 1px);
            background-size: 44px 44px;
            pointer-events: none;
        }

        .loading-container {
            text-align: center;
            max-width: 400px;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        .logo {
            width: 132px;
            height: 92px;
            margin: 0 auto 1.75rem;
            animation: pulse 2.4s ease-in-out infinite;
        }

        .logo svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .logo svg path {
            stroke-dasharray: 280;
            stroke-dashoffset: 280;
            animation: draw 2.6s ease-in-out infinite;
        }

        h1 {
            font-size: 2.1rem;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 0.4rem;
            color: #e8eef5;
        }

        h1 .x { color: #22c55e; }

        p {
            color: #8b9bb0;
            font-size: .8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 2.25rem;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(120, 160, 220, 0.12);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #0d9488, #22c55e 60%, #c9a227);
            border-radius: 4px;
            transition: width 0.3s ease;
            animation: indet 2.2s ease-in-out infinite;
        }

        .status {
            font-size: 0.8125rem;
            color: #8b9bb0;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(34, 197, 94, 0.18);
            border-top-color: #22c55e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.04); opacity: 0.9; }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes draw {
            0% { stroke-dashoffset: 280; }
            55%, 100% { stroke-dashoffset: 0; }
        }

        @keyframes indet {
            0% { width: 8%; }
            60% { width: 82%; }
            100% { width: 96%; }
        }
    </style>
</head>

                      stroke="url(#xg)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <h1><span class="x">X</span>ENORA</h1>
        <p>Biznes boshqaruv tizimi</p>

        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>

        <div class="status">
            <span class="spinner"></span>
            <span id="status">Serverga ulanmoqda...</span>
        </div>
    </div>
</body>
</html>
