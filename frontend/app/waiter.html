<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
<script>/*XENORA_SERVER_CAP*/if(window.Capacitor&&!window.XENORA_SERVER)window.XENORA_SERVER='http://146.190.225.168';</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Ofitsiant | XENORA</title>
<link rel="stylesheet" href="../styles/main.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#d4b46c;--gold-dim:rgba(212,180,108,.15);--bg:#03110c;--bg2:#0b2e23;--bg3:#143a2c;--border:rgba(255,255,255,.1);--text2:#9fcbb9;--text3:#5c8775;--r:.625rem;--r2:1rem}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:#ecf6ef;min-height:100vh}
.ph{display:flex;align-items:center;gap:1rem;padding:.875rem 1.25rem;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.bk{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:var(--r);background:var(--bg3);border:1px solid var(--border);color:var(--text2);text-decoration:none;font-size:1.1rem;transition:.2s}
.bk:hover{border-color:var(--gold);color:var(--gold)}
.pt{font-size:1.125rem;font-weight:700;color:var(--gold);flex:1}
.dot{width:10px;height:10px;border-radius:50%;background:#374151;transition:.3s}
.dot.on{background:#10b981;box-shadow:0 0 8px #10b981}
.pc{padding:1.25rem;max-width:900px;margin:0 auto}
/* Calls section */
.section-title{font-size:.8125rem;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.75rem}
.calls-list{display:flex;flex-direction:column;gap:.625rem;margin-bottom:1.5rem}
.call-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:1rem 1.25rem;display:flex;align-items:center;gap:1rem;animation:slideIn .25s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.call-card.call{border-left:3px solid var(--gold)}
.call-card.bill{border-left:3px solid #10b981}
.call-icon{font-size:1.75rem;flex-shrink:0}
.call-info{flex:1}
.call-table{font-size:1rem;font-weight:700}
.call-reason{font-size:.8125rem;color:var(--text2);margin-top:.15rem}
.call-time{font-size:.75rem;color:var(--text3);margin-top:.15rem}
.btn-ack{padding:.5rem 1rem;border-radius:var(--r);font-size:.8125rem;font-weight:600;cursor:pointer;border:none;background:var(--gold-dim);color:var(--gold);border:1px solid rgba(212,180,108,.3);transition:.2s;white-space:nowrap}
.btn-ack:hover{background:rgba(212,180,108,.25)}
.empty-state{text-align:center;color:var(--text3);padding:2.5rem;font-size:.9rem}
/* Orders */
.orders-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.875rem}
.order-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:1rem}
.order-card.ready{border-color:#10b981}
.ot{font-size:.9rem;font-weight:700;margin-bottom:.375rem;display:flex;align-items:center;justify-content:space-between}
.obadge{font-size:.75rem;padding:.15rem .5rem;border-radius:99px;font-weight:600}
.b-preparing{background:rgba(245,158,11,.15);color:#e2c97a}
.b-ready{background:rgba(16,185,129,.15);color:#10b981}
.b-pending{background:rgba(59,130,246,.15);color:#60a5fa}
.oitems{font-size:.8125rem;color:var(--text2);margin-bottom:.5rem}
.oitems li{list-style:none;padding:.125rem 0}
.oactions{display:flex;gap:.5rem}
.btn-sm{padding:.375rem .875rem;border-radius:var(--r);font-size:.8125rem;font-weight:600;cursor:pointer;border:none;transition:.2s}
.btn-gold{background:linear-gradient(135deg,#c9a84c,#e2c97a,#c9a84c);color:#03110c}
.btn-out{background:transparent;border:1px solid var(--border);color:var(--text2)}
.btn-out:hover{border-color:var(--gold);color:var(--gold)}

/* ─── Premium enhancements ─── */
@keyframes _pgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes _scIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes _flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.ph{animation:_pgIn .22s ease backwards}
.sc{animation:_scIn .28s ease backwards}
.sg>.sc:nth-child(1){animation-delay:.04s}
.sg>.sc:nth-child(2){animation-delay:.09s}
.sg>.sc:nth-child(3){animation-delay:.14s}
.sg>.sc:nth-child(4){animation-delay:.19s}
.card{animation:_pgIn .3s ease .08s backwards}
.tbl tbody tr:hover{background:rgba(212,180,108,.04)!important}
.bk:hover{transform:scale(1.05)}
.pb.active{box-shadow:0 2px 10px rgba(212,180,108,.15)}
.pager-btn.active{box-shadow:0 2px 8px rgba(212,180,108,.12)}
.search-wrap input:focus{box-shadow:0 0 0 2px rgba(212,180,108,.1)}
.empty svg{animation:_flt 3.5s ease-in-out infinite}
.modal.open .mc{animation:_scIn .2s ease}
.btn-gold:hover{transform:translateY(-1px)}
.btn-outline:hover{transform:translateY(-1px)}
</style>
<link rel="stylesheet" href="../styles/premium-overlay.css">
</head>
<body>
<div class="xa-atmos" aria-hidden="true"></div>
<header class="ph">
  <a href="pos.html" class="bk">←</a>
  <h1 class="pt">🛎 Ofitsiant paneli</h1>
  <div id="wsDot" class="dot" title="WebSocket holati"></div>
</header>

<div class="pc">
  <div class="section-title">Chaqiruvlar</div>
  <div class="calls-list" id="callsList">
    <div class="empty-state">Hozircha chaqiruv yo'q</div>
  </div>

  <div class="section-title">Faol buyurtmalar</div>
  <div class="orders-grid" id="ordersGrid">
    <div class="empty-state" style="grid-column:1/-1">Yuklanmoqda...</div>
  </div>
</div>

<script type="module">
import { AuthGuard }       from '../js/core/auth-guard.js';
import { initErrorHandler } from '../js/core/error-handler.js';
AuthGuard.check();
initErrorHandler();
</script>
<script>
if(!localStorage.getItem('access_token')) location.href='../shared/login.html';

const _lport = window.location.port;
const _isDev = ['5500','5501','3000','4200','8080'].includes(_lport) && ['localhost','127.0.0.1'].includes(window.location.hostname);
const BASE   = _isDev ? 'http://localhost:8000/api/v1' : ((window.XENORA_SERVER||'')+'/api/v1');
const tok    = () => localStorage.getItem('access_token');
const api    = { get: u => fetch(`${BASE}${u}`,{headers:{Authorization:'Bearer '+tok()}}).then(r=>r.json()),
                 patch: (u,b) => fetch(`${BASE}${u}`,{method:'PATCH',headers:{'Authorization':'Bearer '+tok(),'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json()) };

const WS_URL = _isDev ? 'ws://localhost:8000/ws/waiter' : (window.XENORA_SERVER?window.XENORA_SERVER.replace(/^http/,'ws'):(location.protocol==='https:'?'wss:':'ws:')+'//'+location.host)+'/ws/waiter';
const REASON_LABELS = { call:'Ofitsiant chaqirdi', bill:'Hisob-kitob so\'radi', help:'Yordam so\'radi' };

let calls = [];   // { id, table_id, table_name, reason, ts }
let callIdCtr = 0;

// ── WebSocket ──────────────────────────────────────────────────────────────────
let ws;
function connectWS() {
  const token = tok();
  if (!token) return;
  ws = new WebSocket(`${WS_URL}?token=${token}`);
  const dot = document.getElementById('wsDot');
  ws.onopen  = () => dot.classList.add('on');
  ws.onclose = () => { dot.classList.remove('on'); setTimeout(connectWS, 5000); };
  ws.onerror = () => ws.close();
  ws.onmessage = e => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'waiter_called') addCall(msg);
      if (msg.type === 'call_cleared')  removeCall(msg.table_id);
    } catch {}
  };
}

function addCall(msg) {
  const id = ++callIdCtr;
  calls.push({ id, table_id: msg.table_id, table_name: msg.table_name, reason: msg.reason || 'call', ts: new Date() });
  renderCalls();
  playBell();
}

function removeCall(tableId) {
  calls = calls.filter(c => c.table_id !== tableId);
  renderCalls();
}

function ackCall(tableId) {
  if (ws?.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'call_acknowledged', table_id: tableId }));
  }
  removeCall(tableId);
}

function renderCalls() {
  const el = document.getElementById('callsList');
  if (!calls.length) { el.innerHTML = '<div class="empty-state">Hozircha chaqiruv yo\'q</div>'; return; }
  el.innerHTML = calls.map(c => `
    <div class="call-card ${c.reason}">
      <div class="call-icon">${c.reason === 'bill' ? '🧾' : '🔔'}</div>
      <div class="call-info">
        <div class="call-table">${c.table_name || 'Stol ' + c.table_id}</div>
        <div class="call-reason">${REASON_LABELS[c.reason] || c.reason}</div>
        <div class="call-time">${c.ts.toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</div>
      </div>
      <button class="btn-ack" onclick="ackCall(${c.table_id})">Qabul qildim</button>
    </div>`).join('');
}

// ── Orders ─────────────────────────────────────────────────────────────────────
async function loadOrders() {
  const res = await api.get('/orders/?status=preparing,ready,pending&page_size=30').catch(()=>null);
  const items = res?.items || (Array.isArray(res) ? res : []);
  const el = document.getElementById('ordersGrid');
  if (!items.length) { el.innerHTML = '<div class="empty-state" style="grid-column:1/-1">Faol buyurtmalar yo\'q</div>'; return; }
  el.innerHTML = items.map(o => `
    <div class="order-card${o.status==='ready'?' ready':''}">
      <div class="ot">
        <span>#${o.order_number} · ${o.table?.name||'Buyurtma'}</span>
        <span class="obadge b-${o.status}">${statusLabel(o.status)}</span>
      </div>
      <ul class="oitems">
        ${(o.items||[]).slice(0,5).map(i=>`<li>• ${i.product?.name||'—'} ×${i.quantity}</li>`).join('')}
        ${(o.items||[]).length>5?`<li style="color:var(--text3)">... va yana ${(o.items||[]).length-5} ta</li>`:''}
      </ul>
      <div class="oactions">
        ${o.status==='ready'?`<button class="btn-sm btn-gold" onclick="serve(${o.id})">Yetkazildi</button>`:''}
        <button class="btn-sm btn-out" onclick="loadOrders()">Yangilash</button>
      </div>
    </div>`).join('');
}

function statusLabel(s){ return {pending:'Yangi',preparing:'Tayyorlanmoqda',ready:'Tayyor',completed:'Tugallandi'}[s]||s; }

async function serve(orderId) {
  await api.patch(`/orders/${orderId}`,{status:'completed'}).catch(()=>null);
  loadOrders();
}

// ── Bell ───────────────────────────────────────────────────────────────────────
function playBell() {
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .8);
    osc.start(); osc.stop(ctx.currentTime + .8);
  } catch {}
}

// ── Init ───────────────────────────────────────────────────────────────────────
connectWS();
loadOrders();
setInterval(loadOrders, 20000);
</script>
</body>
</html>
