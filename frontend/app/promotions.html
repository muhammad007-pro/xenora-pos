<!DOCTYPE html>
<html lang="uz">
<head>
<script>/*XENORA_SERVER_CAP*/if(window.Capacitor&&!window.XENORA_SERVER)window.XENORA_SERVER='https://xenora.uz';</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aksiya / Skidka — XENORA</title>
<link rel="stylesheet" href="../css/main.css">
<style>
  /* SELF-CONTAINED tema — /css/main.css YO'Q (404). Orphaned --var lar to'ldiriladi (zumrad-tilla). */
  :root{
    --surface1:#0a1628; --surface2:#0f2038; --surface3:#16294a;
    --text1:#e8eef5; --text2:#8b9bb0; --text3:#6b7d94;
    --primary:#0d9488; --accent:#22c55e; --border:rgba(34,197,94,.18); --bg:#070f1e;
  }
  [data-theme="light"]{
    --surface1:#ffffff; --surface2:#eef2f9; --surface3:#e6ecf6;
    --text1:#0f2038; --text2:#5a6b82; --text3:#677689;
    --primary:#0a7d72; --accent:#0a7d72; --border:rgba(0,0,0,.1); --bg:#f4f6fb;
  }
  body{font-family:'Inter',system-ui,sans-serif;color:var(--text1)}
  .layout{display:flex;min-height:100vh}
  .main-content{flex:1;min-width:0;padding:1.5rem;max-width:1180px;margin:0 auto;width:100%}
  .btn{display:inline-flex;align-items:center;gap:.375rem;padding:.5rem 1.1rem;border-radius:.5rem;font-size:.875rem;font-weight:600;cursor:pointer;border:1px solid transparent;background:linear-gradient(135deg,#16a34a,#22c55e,#16a34a);color:#04160d;font-family:inherit;transition:.2s}
  .btn:hover{box-shadow:0 0 16px rgba(34,197,94,.35);transform:translateY(-1px)}
  .btn:active{transform:scale(.97)}
  .btn.btn-secondary,.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text2)}
  .inp,input,select,textarea{background:var(--surface2);border:1px solid var(--border);border-radius:.5rem;padding:.5rem .75rem;color:var(--text1);font-size:.875rem;outline:none;font-family:inherit}
  .page-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.5rem; }
  .page-title  { font-size:1.25rem; font-weight:700; }
  .kpi-row     { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:1rem; margin-bottom:1.5rem; }
  .kpi-card    { background:var(--surface1); border:1px solid var(--border); border-radius:.75rem; padding:1rem 1.25rem; }
  .kpi-label   { font-size:.75rem; color:var(--text2); margin-bottom:.375rem; }
  .kpi-value   { font-size:1.5rem; font-weight:800; }
  .filter-bar  { display:flex; gap:.75rem; flex-wrap:wrap; margin-bottom:1.25rem; align-items:flex-end; }
  .promo-grid  { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:1rem; }
  .promo-card  { background:var(--surface1); border:1px solid var(--border); border-radius:.875rem; padding:1.25rem; position:relative; }
  .promo-card.inactive { opacity:.6; }
  .promo-header{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:.875rem; }
  .promo-name  { font-size:1rem; font-weight:700; }
  .promo-type  { font-size:.75rem; font-weight:700; padding:.2rem .5rem; border-radius:.375rem; }
  .type-percentage { background:#dbeafe; color:#1e40af; }
  .type-fixed      { background:#fef3c7; color:#92400e; }
  .type-bogo       { background:#d1fae5; color:#065f46; }
  .type-bundle     { background:#ede9fe; color:#4c1d95; }
  .type-happy_hour { background:#fce7f3; color:#831843; }
  .promo-dates { font-size:.75rem; color:var(--text2); margin-bottom:.625rem; }
  .promo-detail{ font-size:.8125rem; color:var(--text1); margin-bottom:.875rem; min-height:2rem; }
  .promo-footer{ display:flex; justify-content:space-between; align-items:center; }
  .badge-active   { background:#d1fae5; color:#065f46; padding:.2rem .5rem; border-radius:.375rem; font-size:.75rem; font-weight:700; }
  .badge-inactive { background:#f3f4f6; color:#6b7280; padding:.2rem .5rem; border-radius:.375rem; font-size:.75rem; font-weight:700; }
  .badge-expired  { background:#fee2e2; color:#991b1b; padding:.2rem .5rem; border-radius:.375rem; font-size:.75rem; font-weight:700; }
  .action-btns { display:flex; gap:.375rem; }
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:999; align-items:center; justify-content:center; }
  .modal-overlay.active { display:flex; }
  .modal-box  { background:var(--surface1); border-radius:1rem; padding:1.5rem; max-width:640px; width:96%; max-height:92vh; overflow-y:auto; }
  .modal-title{ font-size:1.125rem; font-weight:700; margin-bottom:1.25rem; }
  .form-row   { margin-bottom:.875rem; }
  .form-label { font-size:.8125rem; color:var(--text2); margin-bottom:.375rem; display:block; }
  .form-grid  { display:grid; grid-template-columns:1fr 1fr; gap:.75rem; }
  .tabs { display:flex; gap:.375rem; margin-bottom:1.5rem; border-bottom:1px solid var(--border); }
  .tab { padding:.5rem 1rem; font-size:.875rem; font-weight:500; color:var(--text2); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tab.active { color:var(--primary); border-bottom-color:var(--primary); font-weight:600; }
</style>
<link rel="stylesheet" href="../styles/premium-overlay.css">
<!-- Mobil qatlam - ENG OXIRGI stil (faqat @media max-width ichida ishlaydi) -->
<link rel="stylesheet" href="../styles/mobile.css">
</head>
<body>
<div class="xa-atmos" aria-hidden="true"></div>
<div class="layout">
  <div id="sidebar-container"></div>
  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">🎁 Aksiya / Skidka</h1>
      <button class="btn" id="btnAdd">+ Yangi aksiya</button>
    </div>

    <div class="kpi-row">
      <div class="kpi-card">
        <div class="kpi-label">Jami aksiya</div>
        <div class="kpi-value" id="kpiTotal">—</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Faol</div>
        <div class="kpi-value" id="kpiActive" style="color:#22c55e">—</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Muddati o'tgan</div>
        <div class="kpi-value" id="kpiExpired" style="color:#ef4444">—</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Bugungi aksiya</div>
        <div class="kpi-value" id="kpiToday" style="color:#0d9488">—</div>
      </div>
    </div>

    <div class="filter-bar">
      <div class="tabs">
        <div class="tab active" data-filter="all"   onclick="setTab(this,'all')">Barchasi</div>
        <div class="tab"        data-filter="active" onclick="setTab(this,'active')">Faol</div>
        <div class="tab"        data-filter="inactive" onclick="setTab(this,'inactive')">Nofaol</div>
      </div>
      <div style="margin-left:auto">
        <label class="form-label">Turi</label>
        <select class="inp" id="filterType" style="width:160px" onchange="load()">
          <option value="">Barchasi</option>
          <option value="percentage">Foiz chegirma</option>
          <option value="fixed">Belgilangan sum</option>
          <option value="bogo">1ta olsang 1ta bepul</option>
          <option value="bundle">Komplekt</option>
          <option value="happy_hour">Happy Hour</option>
        </select>
      </div>
    </div>

    <div class="promo-grid" id="promoGrid">
      <div style="text-align:center;padding:2rem;color:var(--text2)">Yuklanmoqda...</div>
    </div>
  </main>
</div>

<!-- CREATE / EDIT MODAL -->
<div class="modal-overlay" id="modalCreate">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">Yangi aksiya</div>
    <input type="hidden" id="editId">
    <div class="form-row">
      <label class="form-label">Aksiya nomi *</label>
      <input class="inp" id="fName" placeholder="Yoz chegirmalari">
    </div>
    <div class="form-row">
      <label class="form-label">Aksiya turi *</label>
      <select class="inp" id="fType" onchange="onTypeChange()">
        <option value="flash_price">⚡ Flash narx (vaqtinchalik narx)</option>
        <option value="min_amount">💰 Summa chegirmasi (X so'mdan ortiq)</option>
        <option value="min_qty_discount">📦 Miqdor chegirmasi (X donadan ortiq)</option>
        <option value="buy_x_get_y">🎁 2 ol 1 ol (bepul mahsulot)</option>
      </select>
    </div>

    <datalist id="promoProductList"></datalist>
    <div class="form-row" id="rowProduct">
      <label class="form-label" id="lblProduct">Mahsulot *</label>
      <input class="inp" id="fProduct" list="promoProductList" placeholder="Mahsulot nomini yozing / tanlang" autocomplete="off">
    </div>

    <div class="form-row" id="rowFlash" style="display:none">
      <label class="form-label">Yangi (flash) narx *</label>
      <input class="inp" type="number" id="fFlashPrice" min="0" placeholder="9900">
    </div>

    <div class="form-grid" id="rowDisc" style="display:none">
      <div class="form-row">
        <label class="form-label">Chegirma turi</label>
        <select class="inp" id="fDiscType"><option value="percentage">Foiz (%)</option><option value="fixed">Belgilangan (so'm)</option></select>
      </div>
      <div class="form-row">
        <label class="form-label">Chegirma qiymati *</label>
        <input class="inp" type="number" id="fValue" min="0" placeholder="10">
      </div>
    </div>

    <div class="form-row" id="rowMinAmount" style="display:none">
      <label class="form-label">Minimal xarid summasi (so'm) *</label>
      <input class="inp" type="number" id="fMinAmount" min="0" placeholder="100000">
    </div>
    <div class="form-row" id="rowMinQty" style="display:none">
      <label class="form-label">Minimal miqdor (dona) *</label>
      <input class="inp" type="number" id="fMinQty" min="1" placeholder="3">
    </div>

    <div class="form-grid" id="rowBuy" style="display:none">
      <div class="form-row">
        <label class="form-label">Nechta olsa (X) *</label>
        <input class="inp" type="number" id="fBuyQty" min="1" placeholder="2">
      </div>
      <div class="form-row">
        <label class="form-label">Bepul nima?</label>
        <select class="inp" id="fFreeType" onchange="onTypeChange()">
          <option value="same">Shu mahsulot bepul</option>
          <option value="other">Boshqa mahsulot bepul</option>
        </select>
      </div>
    </div>
    <div class="form-row" id="rowGetQty" style="display:none">
      <label class="form-label">Nechta bepul (shu mahsulot) *</label>
      <input class="inp" type="number" id="fGetQty" min="1" placeholder="1">
    </div>
    <div class="form-row" id="rowFreeProduct" style="display:none">
      <label class="form-label">Bepul mahsulot (Y) *</label>
      <input class="inp" id="fFreeProduct" list="promoProductList" placeholder="Bepul mahsulot nomi" autocomplete="off">
    </div>
    <div class="form-row" id="rowFreeQty" style="display:none">
      <label class="form-label">Har to'plamга nechta bepul</label>
      <input class="inp" type="number" id="fFreeQty" min="1" value="1">
    </div>

    <div class="form-grid">
      <div class="form-row"><label class="form-label">Boshlanish sanasi</label><input class="inp" type="date" id="fStart"></div>
      <div class="form-row"><label class="form-label">Tugash sanasi</label><input class="inp" type="date" id="fEnd"></div>
    </div>
    <div class="form-grid">
      <div class="form-row"><label class="form-label">Vaqt (dan, ixtiyoriy)</label><input class="inp" type="time" id="fHhStart"></div>
      <div class="form-row"><label class="form-label">Vaqt (gача, ixtiyoriy)</label><input class="inp" type="time" id="fHhEnd"></div>
    </div>
    <div class="form-row">
      <label class="form-label">Foydalanish limiti (ixtiyoriy)</label>
      <input class="inp" type="number" id="fUsageLimit" min="0" placeholder="∞">
    </div>
    <div class="form-row" style="display:flex;align-items:center;gap:.5rem">
      <label style="display:flex;align-items:center;gap:.5rem;font-size:.875rem;cursor:pointer">
        <input type="checkbox" id="fActive" checked> Faol
      </label>
    </div>
    <div style="display:flex;gap:.75rem;margin-top:1rem">
      <button class="btn btn-secondary" onclick="closeModal()">Bekor</button>
      <button class="btn" onclick="savePromo()">Saqlash</button>
    </div>
  </div>
</div>

<script type="module">
import { Sidebar } from '../js/core/sidebar.js';
import { API }     from '../js/core/api.js';
import { toast }   from '../js/core/toast.js';

const api = new API();
await Sidebar.init();

let promos = [];
let activeFilter = 'all';

window.setTab = function(el, filter) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  activeFilter = filter;
  renderGrid();
};

let PRODUCTS = {};   // nom(lower) → id (mahsulot picker uchun)
async function loadProductsForPicker() {
  try {
    const res   = await api.get('/products/?page_size=1000&is_active=true');
    const items = res?.items || res?.data?.items || (Array.isArray(res?.data)?res.data:null) || (Array.isArray(res)?res:[]);
    let opts = '';
    (items||[]).forEach(p => { if (p && p.name) { PRODUCTS[p.name.trim().toLowerCase()] = p.id; opts += `<option value="${p.name}"></option>`; } });
    const dl = document.getElementById('promoProductList'); if (dl) dl.innerHTML = opts;
  } catch (e) { /* jim */ }
}
loadProductsForPicker();

window.onTypeChange = function() {
  const type = document.getElementById('fType').value;
  const show = (id, v) => { const el = document.getElementById(id); if (el) el.style.display = v ? '' : 'none'; };
  const isFlash = type==='flash_price', isMinA = type==='min_amount', isMinQ = type==='min_qty_discount', isBuy = type==='buy_x_get_y';
  show('rowFlash', isFlash);
  show('rowDisc', isMinA || isMinQ);
  show('rowMinAmount', isMinA);
  show('rowMinQty', isMinQ);
  show('rowBuy', isBuy);
  const lblP = document.getElementById('lblProduct');
  if (lblP) lblP.textContent = isMinA ? "Mahsulot (ixtiyoriy — bo'sh: butun savat)" : 'Mahsulot *';
  const freeType = document.getElementById('fFreeType') ? document.getElementById('fFreeType').value : 'same';
  show('rowGetQty', isBuy && freeType === 'same');
  show('rowFreeProduct', isBuy && freeType === 'other');
  show('rowFreeQty', isBuy);
};

window.load = async function() {
  const type = document.getElementById('filterType').value;
  let url = '/promotions/?page_size=200';
  if (type) url += `&promo_type=${type}`;
  const res = await api.get(url);
  promos = res.items || res || [];

  const today = new Date().toISOString().split('T')[0];
  document.getElementById('kpiTotal').textContent   = promos.length;
  document.getElementById('kpiActive').textContent  = promos.filter(p=>p.is_active).length;
  document.getElementById('kpiExpired').textContent = promos.filter(p=>p.end_date && p.end_date < today).length;
  document.getElementById('kpiToday').textContent   = promos.filter(p=>p.is_active && (!p.start_date||p.start_date<=today) && (!p.end_date||p.end_date>=today)).length;

  renderGrid();
};

function renderGrid() {
  const today = new Date().toISOString().split('T')[0];
  let list = promos;
  if (activeFilter === 'active')   list = promos.filter(p=>p.is_active);
  if (activeFilter === 'inactive') list = promos.filter(p=>!p.is_active);

  const typeLabels = { flash_price:'⚡ Flash', min_amount:'💰 Summa', min_qty_discount:'📦 Miqdor', buy_x_get_y:'🎁 2 ol 1 ol',
                       percentage:'Foiz %', fixed:'Belgilangan', bogo:'1+1', bundle:'Komplekt', happy_hour:'Happy Hour' };

  if (!list.length) {
    document.getElementById('promoGrid').innerHTML = '<div style="text-align:center;padding:2rem;color:var(--text2)">Aksiya yo\'q</div>';
    return;
  }

  document.getElementById('promoGrid').innerHTML = list.map(p => {
    const expired = p.end_date && p.end_date < today;
    const statusCls  = expired ? 'badge-expired' : p.is_active ? 'badge-active' : 'badge-inactive';
    const statusText = expired ? 'Muddati o\'tgan' : p.is_active ? 'Faol' : 'Nofaol';
    const ptype  = p.promo_type || p.promotion_type || 'percentage';
    const detail = p.discount_value
      ? (ptype === 'percentage' ? `${p.discount_value}% chegirma` : `${Number(p.discount_value).toLocaleString()} so'm chegirma`)
      : '';
    return `
    <div class="promo-card ${!p.is_active?'inactive':''}">
      <div class="promo-header">
        <div class="promo-name">${escHtml(p.name)}</div>
        <span class="promo-type type-${ptype}">${typeLabels[ptype]||ptype}</span>
      </div>
      <div class="promo-dates">
        📅 ${p.start_date||'?'} → ${p.end_date||'Cheksiz'}
        ${p.time_from ? `⏰ ${p.time_from}–${p.time_to}` : ''}
      </div>
      <div class="promo-detail">${detail}</div>
      ${p.min_purchase_amount ? `<div style="font-size:.75rem;color:var(--text2);margin-bottom:.5rem">Min buyurtma: ${Number(p.min_purchase_amount).toLocaleString()} so'm</div>` : ''}
      <div class="promo-footer">
        <span class="${statusCls}">${statusText}</span>
        <div class="action-btns">
          <button class="btn btn-sm" onclick="editPromo(${p.id})">Tahrir</button>
          <button class="btn btn-sm" onclick="togglePromo(${p.id},${!p.is_active})">${p.is_active?'O\'ch':'Yoq'}</button>
          <button class="btn btn-sm btn-danger" onclick="deletePromo(${p.id})">Del</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function escHtml(s) { return String(s).replace(/[<>"'&]/g, c=>({'<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','&':'&amp;'}[c])); }

window.editPromo = function(id) {
  const p = promos.find(x=>x.id===id); if (!p) return;
  const set = (elid, v) => { const el = document.getElementById(elid); if (el) el.value = v; };
  document.getElementById('modalTitle').textContent = 'Aksiyani tahrirlash';
  set('editId', p.id);
  set('fName', p.name || '');
  set('fType', p.promo_type || 'flash_price');
  set('fProduct', p.product_name || '');
  set('fFlashPrice', p.flash_price || '');
  set('fDiscType', p.discount_type || 'percentage');
  set('fValue', p.discount_value || '');
  set('fMinAmount', p.min_purchase_amount || '');
  set('fMinQty', p.min_purchase_qty || '');
  set('fBuyQty', p.buy_qty || '');
  set('fFreeType', p.free_product_id ? 'other' : 'same');
  set('fGetQty', p.get_qty || '');
  set('fFreeProduct', p.free_product_name || '');
  set('fFreeQty', p.free_qty_per_set || 1);
  set('fStart', (p.start_date||'').slice(0,10));
  set('fEnd', (p.end_date||'').slice(0,10));
  set('fHhStart', p.time_from || '');
  set('fHhEnd', p.time_to || '');
  set('fUsageLimit', p.usage_limit || '');
  document.getElementById('fActive').checked = p.is_active;
  onTypeChange();
  document.getElementById('modalCreate').classList.add('active');
};

window.savePromo = async function() {
  const id   = document.getElementById('editId').value;
  const name = document.getElementById('fName').value.trim();
  const type = document.getElementById('fType').value;
  if (!name) { toast('Nom kiritilmadi', 'error'); return; }
  const num    = (elid) => { const v = parseFloat(document.getElementById(elid).value); return isNaN(v) ? null : v; };
  const prodId = (elid) => PRODUCTS[(document.getElementById(elid).value||'').trim().toLowerCase()] || null;

  const body = {
    name, promo_type: type,
    is_active:   document.getElementById('fActive').checked,
    start_date:  document.getElementById('fStart').value || null,
    end_date:    document.getElementById('fEnd').value   || null,
    time_from:   document.getElementById('fHhStart').value || null,
    time_to:     document.getElementById('fHhEnd').value   || null,
    usage_limit: num('fUsageLimit'),
    product_id: null, category_id: null, discount_type: null, discount_value: null,
    flash_price: null, min_purchase_amount: null, min_purchase_qty: null,
    buy_qty: null, get_qty: null, free_product_id: null, free_qty_per_set: null,
  };

  if (type === 'flash_price') {
    body.product_id = prodId('fProduct'); body.flash_price = num('fFlashPrice');
    if (!body.product_id || body.flash_price == null) { toast('Mahsulot + flash narx kiriting', 'error'); return; }
  } else if (type === 'min_amount') {
    body.product_id = prodId('fProduct');   // ixtiyoriy → bo'sh: butun savat
    body.discount_type = document.getElementById('fDiscType').value; body.discount_value = num('fValue');
    body.min_purchase_amount = num('fMinAmount');
    if (body.discount_value == null || body.min_purchase_amount == null) { toast('Chegirma + min summa kiriting', 'error'); return; }
  } else if (type === 'min_qty_discount') {
    body.product_id = prodId('fProduct');
    body.discount_type = document.getElementById('fDiscType').value; body.discount_value = num('fValue');
    body.min_purchase_qty = num('fMinQty');
    if (!body.product_id || body.discount_value == null || body.min_purchase_qty == null) { toast('Mahsulot + chegirma + min miqdor kiriting', 'error'); return; }
  } else if (type === 'buy_x_get_y') {
    body.product_id = prodId('fProduct'); body.buy_qty = num('fBuyQty'); body.free_qty_per_set = num('fFreeQty') || 1;
    if (document.getElementById('fFreeType').value === 'other') {
      body.free_product_id = prodId('fFreeProduct');
      if (!body.free_product_id) { toast('Bepul mahsulot (Y) tanlanmadi', 'error'); return; }
    } else {
      body.get_qty = num('fGetQty');
      if (!body.get_qty) { toast('Nechta bepul kiriting', 'error'); return; }
    }
    if (!body.product_id || !body.buy_qty) { toast('Mahsulot (X) + nechta olsa kiriting', 'error'); return; }
  }

  try {
    if (id) await api.put(`/promotions/${id}`, body);
    else     await api.post('/promotions/', body);
    toast('Saqlandi', 'success');
    closeModal();
    load();
  } catch (e) { toast(e.message || 'Xatolik', 'error'); }
};

window.togglePromo = async function(id, active) {
  await api.put(`/promotions/${id}`, { is_active: active });
  toast(active ? 'Yoqildi' : 'O\'chirildi', 'success');
  load();
};

window.deletePromo = async function(id) {
  if (!confirm('Aksiyani o\'chirishni tasdiqlaysizmi?')) return;
  await api.delete(`/promotions/${id}`);
  toast('O\'chirildi', 'success');
  load();
};

window.closeModal = function() {
  document.getElementById('modalCreate').classList.remove('active');
  document.getElementById('editId').value = '';
  document.getElementById('modalTitle').textContent = 'Yangi aksiya';
  document.getElementById('fValue').value = '';
};

document.getElementById('btnAdd').onclick = () => {
  closeModal();
  onTypeChange();
  document.getElementById('modalCreate').classList.add('active');
};
document.getElementById('modalCreate').addEventListener('click', e => { if(e.target===e.currentTarget) closeModal(); });

load();
</script>
</body>
</html>
