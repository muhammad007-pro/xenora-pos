# Umumiy location bloklari — HTTP va HTTPS server bloklari uchun bir xil
# nginx.conf da `include /etc/nginx/conf.d/common.conf;` orqali ulanadi

# Xavfsizlik headerlari
add_header X-Content-Type-Options    "nosniff"         always;
add_header X-Frame-Options           "SAMEORIGIN"      always;
add_header X-XSS-Protection          "1; mode=block"   always;
add_header Referrer-Policy           "strict-origin"   always;

# Xato sahifalari
error_page 404 /shared/error.html;
location = /shared/error.html {
    internal;
}

# 429 — Rate limit (JSON javob, API uchun)
error_page 429 @rate_limited;
location @rate_limited {
    default_type application/json;
    return 429 '{"detail":"Too many requests. Please try again later.","code":429}';
}

# Frontend sahifalari (HTML) — kesh o'chirilgan
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}

# Statik fayllar (JS, CSS, rasmlar) — 1 yil kesh
# DIQQAT: bu location o'z add_header'iga ega — nginx qoidasiga ko'ra tepadagi umumiy
# xavfsizlik headerlari (nosniff va h.k.) MEROS OLINMAYDI. Shu sabab yuklangan rasmlar
# uchun ularni SHU YERDA qayta e'lon qilamiz (nosniff — MIME-sniff/stored-XSS himoyasi).
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin" always;
    try_files $uri =404;
}

# Service Worker — kesh o'chirilgan.
#
# ⚠️ YO'L O'ZGARDI: `/pwa/service-worker.js` → `/service-worker.js`.
# Service worker faqat O'Z PAPKASI va undan pastini boshqaradi, ya'ni
# `/pwa/` dan berilganda scope `/pwa/` bo'lib qolardi va `/app/*`, `/js/*`
# so'rovlari UMUMAN ko'rinmasdi. Ildizdan berilganda scope `/` avtomatik.
#
# `Service-Worker-Allowed` ATAYLAB YO'Q: u faqat skript ildizdan TASHQARIDA
# turganda kerak bo'ladi. Unga tayanmaymiz — header yo'q bo'lsa
# `register({scope:'/'})` SecurityError beradi va offline rejim butunlay
# o'chadi. Fayl ildizda bo'lsa hech qanday header shart emas.
#
# `location =` (aniq moslik) tepadagi `~* \.(js|css|...)$` regex'idan USTUN —
# ya'ni service worker "immutable 1 yil" keshiga tushmaydi.
location = /service-worker.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
}

# ⚠️ DIQQAT (2026-10-04): bu fayl ishlab chiqarish serveriga DEPLOY
# QILINMAGAN. Jonli nginx `/etc/nginx/snippets/xenora-common.conf` ni
# ishlatadi va unda yuqoridagi bloklarning ko'pi (statik kesh, SW bloki) YO'Q
# — faqat `location / { try_files ... }` bor. Ya'ni bu repo konfiguratsiyasi
# hujjat holida: o'zgartirish kiritsangiz serverdagi snippet'ni ham
# qo'lda yangilash kerak.

# API proksi (umumiy limit: 30 req/s)
location /api/ {
    limit_req zone=api burst=50 nodelay;
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
}

# Auth endpointlar (qattiqroq limit: 5 req/min — brute-force himoyasi)
location /api/v1/auth/login {
    limit_req zone=auth burst=3 nodelay;
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# WebSocket proksi
location /ws {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# FastAPI docs (development'da foydali)
location /docs {
    proxy_pass http://backend;
    proxy_set_header Host $host;
}

location /openapi.json {
    proxy_pass http://backend;
    proxy_set_header Host $host;
}

location /redoc {
    proxy_pass http://backend;
    proxy_set_header Host $host;
}
