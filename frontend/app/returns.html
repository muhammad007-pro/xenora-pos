<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#d4b46c;--gold-dim:rgba(34,197,94,.15);--bg:#070f1e;--bg2:#0a1628;--bg3:#0f2038;--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.12);--text:#e8eef5;--text2:#8b9bb0;--text3:#6b7d94;--green:#22c55e;--red:#ef4444;--orange:#f59e0b;--r:.5rem;--r2:.875rem}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.ph{display:flex;align-items:center;gap:.75rem;padding:.875rem 1.5rem;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.bk{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:var(--r);background:var(--bg3);border:1px solid var(--border);color:var(--text2);text-decoration:none;font-size:1.1rem;transition:.2s}
.bk:hover{border-color:var(--gold);color:var(--gold)}
.ph-title{font-size:1.125rem;font-weight:700;color:var(--gold);flex:1}
.btn{display:inline-flex;align-items:center;gap:.375rem;padding:.5rem 1rem;border-radius:var(--r);font-size:.875rem;font-weight:600;cursor:pointer;border:none;transition:.2s;font-family:inherit}
.btn-gold{background:var(--gold);color:#04160d}
.btn-gold:hover{opacity:.9}
.btn-out{background:transparent;border:1px solid var(--border2);color:var(--text2)}
.btn-out:hover{border-color:var(--gold);color:var(--gold)}
.btn-green{background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.3);color:var(--green)}
.btn-red{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:var(--red)}
.btn-sm{padding:.3rem .65rem;font-size:.8rem}
.pc{padding:1.5rem;max-width:1200px;margin:0 auto}

/* Stats */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1.25rem}
@media(max-width:700px){.stats-row{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:1rem}
.stat-val{font-size:1.5rem;font-weight:700;color:var(--gold)}
.stat-lbl{font-size:.75rem;color:var(--text3);margin-top:.25rem}

/* Filters */
.filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.form-control{padding:.45rem .875rem;border-radius:var(--r);border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:.875rem;outline:none;font-family:inherit;transition:.2s}
.form-control:focus{border-color:var(--gold)}
select.form-control option{background:var(--bg2)}

/* Table */
.tbl-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{padding:.625rem 1rem;text-align:left;font-size:.75rem;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);background:var(--bg3)}
td{padding:.625rem 1rem;font-size:.8125rem;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}

.badge{display:inline-flex;align-items:center;gap:.25rem;padding:.2rem .5rem;border-radius:.25rem;font-size:.7rem;font-weight:600}
.badge-pending{background:rgba(245,158,11,.15);color:var(--orange)}
.badge-approved{background:rgba(16,185,129,.15);color:var(--green)}
.badge-rejected{background:rgba(239,68,68,.15);color:var(--red)}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r2);padding:1.5rem;width:100%;max-width:680px;max-height:90vh;overflow-y:auto}
.modal-title{font-size:1.125rem;font-weight:700;margin-bottom:1.25rem;color:var(--gold)}
.form-group{margin-bottom:.875rem}
.form-group label{display:block;font-size:.8125rem;font-weight:500;color:var(--text2);margin-bottom:.375rem}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
@media(max-width:500px){.form-row{grid-template-columns:1fr}}
.modal-footer{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1.25rem;padding-top:1rem;border-top:1px solid var(--border)}

/* Items table inside modal */
.items-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem}
.items-header span{font-size:.8125rem;font-weight:600;color:var(--text2)}
.item-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:.5rem;align-items:center;padding:.375rem 0;border-bottom:1px solid var(--border)}
.item-row:last-child{border-bottom:none}
.item-row-head{font-size:.7rem;color:var(--text3);font-weight:600;text-transform:uppercase;padding:.25rem 0;border-bottom:1px solid var(--border)}

/* Detail panel */
.detail-items{margin-top:.75rem;background:var(--bg3);border-radius:var(--r);padding:.75rem}
.detail-item-row{display:flex;justify-content:space-between;align-items:center;padding:.375rem 0;border-bottom:1px solid var(--border);font-size:.8125rem}
.detail-item-row:last-child{border-bottom:none}

.empty{text-align:center;padding:3rem;color:var(--text3);font-size:.875rem}
.loading{text-align:center;padding:2rem;color:var(--text3)}
</style>

<!-- Qidiruvli select (classic — window.searchableSelect; modul bloki undan keyin ishlaydi).
     `defer` MAJBURIY: parserni to'sadigan oddiy <script> bu sahifada quyidagi
     modul importlarini (config.js, error-handler.js) OSIB QO'YARDI — sahifa
     "Yuklanmoqda..." holatida qotib qolardi. `defer` bilan ikkalasi ham
     "hujjat tugagach" ro'yxatiga tushadi va HUJJAT TARTIBIDA bajariladi,
     ya'ni `window.searchableSelect` modul blokidan OLDIN tayyor bo'ladi. -->
<script defer src="../js/ui/searchable-select.js"></script>
<script type="module">
import { API_BASE } from '../js/core/config.js';
import { initErrorHandler, showToast } from '../js/core/error-handler.js';
initErrorHandler();

// ⚠️ TUZATISH (labels.html bilan bir xil xato): auth.js `getToken` ni
// EKSPORT QILMAYDI — mavjud bo'lmagan nomni import qilish ES modulda link
// xatosi va butun sahifa skripti ishga tushmaydi. Loyihadagi izchil usul —
// localStorage 'access_token' (admin/core.js, pos.js, api.js ham shundan).
const getToken = () => localStorage.getItem('access_token');

const API = API_BASE;   // getApiBase() hech qachon mavjud bo'lmagan (config.js API_BASE eksport qiladi)
const h = () => ({ Authorization: 'Bearer ' + getToken(), 'Content-Type': 'application/json' });

let allProducts = [];
let allCustomers = [];
let currentReturnId = null;
let itemRowCount = 0;

const REASON_LABELS = {
  broken: 'Buzuq', dislike: "Yoqmadi", expired: "Muddati o'tgan",
  wrong_item: "Noto'g'ri tovar", other: "Boshqa"
};
const REFUND_LABELS = {
  cash: 'Naqd', card: 'Karta', credit: 'Balansga', exchange: 'Almashtirish'
};

async function init() {
  await Promise.all([loadProducts(), loadCustomers()]);
  load();
}

async function loadProducts() {
  try {
    // 500 -> 1000 (endpoint maksimumi): Fazza Parfumda 794 faol mahsulot bor
    // edi, ya'ni 294 tasi dropdownga UMUMAN tushmasdi. 1000 dan oshgani
    // searchableSelect orqali SERVERDAN topiladi.
    const r = await fetch(`${API}/products/?page_size=1000`, { headers: h() });
    if (r.ok) {
      const d = await r.json();
      allProducts = Array.isArray(d) ? d : (d.items || []);
    }
  } catch {}
}

async function loadCustomers() {
  try {
    // 500 -> 1000: mahsulot bilan bir xil kesilish sinfi. Mijozlar soni tez
    // o'sadi (nasiya v1.9.1 dan ishlaydi) — undan oshgani server qidiruvida.
    const r = await fetch(`${API}/customers/?page_size=1000`, { headers: h() });
    if (r.ok) {
      const d = await r.json();
      const list = Array.isArray(d) ? d : (d.items || []);
      const sel = document.getElementById('cCustomerId');
      list.forEach(c => {
        const o = document.createElement('option');
        o.value = c.id;
        o.textContent = `${c.name}${c.phone ? ' · ' + c.phone : ''}`;
        sel.appendChild(o);
      });
      allCustomers = list;
      attachCustomerSearch(sel);
    }
  } catch {}
}

// ── BOSQICH C: qidiruv qatlami (Priyomka/dmCustomer naqshi) ─────────────────
// QOIDA: mavjud `<select>` DOM'da QOLADI. `sel.value` va `opt.dataset.price`
// o'qiydigan joylar (submitReturn, ip${idx}.onchange, calcTotal) TEGILMADI —
// komponent faqat option'larni almashtiradi.
//
// QIDIRUV SERVERDA: 794 (kelajakda ko'proq) mahsulotni brauzerga tortmaymiz.
function attachProductSearch(select) {
  if (!select || typeof window.searchableSelect !== 'function') return;
  window.searchableSelect(select, {
    placeholder: 'Mahsulot nomi bilan qidirish...',
    initial: allProducts,
    limit: 50,
    render: (p) => ({ value: p.id, label: p.name, data: { price: p.price || 0 } }),
    search: async (q) => {
      try {
        const r = await fetch(`${API}/products/?search=${encodeURIComponent(q)}&page_size=50`, { headers: h() });
        if (!r.ok) return [];
        const d = await r.json();
        const found = Array.isArray(d) ? d : (d.items || []);
        // Topilganlarni mahalliy ro'yxatga ham qo'shamiz — tafsilot modalidagi
        // nom qidiruvi (allProducts.find) ularni keyin ham topa olsin.
        found.forEach(p => { if (!allProducts.some(x => x.id === p.id)) allProducts.push(p); });
        return found;
      } catch { return []; }
    },
  });
}

function attachCustomerSearch(select) {
  if (!select || typeof window.searchableSelect !== 'function' || select._ss) return;
  window.searchableSelect(select, {
    placeholder: 'Ism yoki telefon bilan qidirish...',
    initial: allCustomers,
    limit: 50,
    render: (c) => ({ value: c.id, label: `${c.name}${c.phone ? ' · ' + c.phone : ''}` }),
    search: async (q) => {
      try {
        const r = await fetch(`${API}/customers/?search=${encodeURIComponent(q)}&page_size=50`, { headers: h() });
        if (!r.ok) return [];
        const d = await r.json();
        const list = Array.isArray(d) ? d : (d.items || []);
        list.forEach(c => { if (!allCustomers.some(x => x.id === c.id)) allCustomers.push(c); });
        return list;
      } catch { return []; }
    },
  });
}

window.load = async function() {
  const status = document.getElementById('fStatus').value;
  const from = document.getElementById('fFrom').value;
  const to = document.getElementById('fTo').value;

  let url = `${API}/returns/?page_size=200`;
  if (status) url += `&status=${status}`;
  if (from) url += `&date_from=${from}`;
  if (to) url += `&date_to=${to}`;

  const tb = document.getElementById('tbody');
  tb.innerHTML = '<tr><td colspan="8" class="loading">Yuklanmoqda...</td></tr>';

  try {
    const r = await fetch(url, { headers: h() });
    const data = await r.json();
    renderTable(Array.isArray(data) ? data : []);
    updateStats(Array.isArray(data) ? data : []);
  } catch {
    tb.innerHTML = '<tr><td colspan="8" class="empty">Yuklab bo\'lmadi</td></tr>';
  }
};

function updateStats(list) {
  document.getElementById('sTotalCount').textContent = list.length;
  const approved = list.filter(r => r.status === 'approved');
  const pending = list.filter(r => r.status === 'pending');
  document.getElementById('sApproved').textContent = approved.length;
  document.getElementById('sPending').textContent = pending.length;
  const totalAmt = approved.reduce((s, r) => s + r.total_amount, 0);
  document.getElementById('sTotalAmount').textContent = fmtNum(totalAmt) + ' so\'m';
}

function renderTable(list) {
  const tb = document.getElementById('tbody');
  if (!list.length) {
    tb.innerHTML = '<tr><td colspan="8" class="empty">Qaytarish yo\'q</td></tr>';
    return;
  }
  tb.innerHTML = list.map(ret => `
    <tr>
      <td style="font-family:monospace;font-size:.75rem;color:var(--text3)">${ret.return_number}</td>
      <td>${fmtDate(ret.created_at)}</td>
      <td>${ret.customer ? escHtml(ret.customer.name) : '<span style="color:var(--text3)">—</span>'}</td>
      <td>${REASON_LABELS[ret.reason] || ret.reason}</td>
      <td>${REFUND_LABELS[ret.refund_method] || ret.refund_method}</td>
      <td style="font-weight:600;color:var(--gold)">${fmtNum(ret.total_amount)} so'm</td>
      <td><span class="badge badge-${ret.status}">${statusLabel(ret.status)}</span></td>
      <td>
        <button class="btn btn-out btn-sm" onclick="openDetail(${ret.id})">Ko'rish</button>
      </td>
    </tr>
  `).join('');
}

function statusLabel(s) {
  return s === 'pending' ? '⏳ Kutilmoqda' : s === 'approved' ? '✓ Tasdiqlandi' : '✗ Rad etildi';
}

// ── YARATISH MODAL ──────────────────────────────────────────────────────────
window.openCreateModal = function() {
  document.getElementById('cItems').innerHTML = '';
  document.getElementById('cTotal').textContent = '';
  document.getElementById('cOrderId').value = '';
  document.getElementById('cNotes').value = '';
  const cs = document.getElementById('cCustomerId');
  // Modal QAYTA ochilganda eski qidiruv matni qolmasin va ro'yxat yangilansin
  // (dmCustomer naqshi) — `reset()` dan KEYIN tozalaymiz, aks holda filtrdan
  // qolgan option qayta tanlanib qolardi.
  if (cs._ss) { cs._ss.setInitial(allCustomers); cs._ss.reset(); }
  cs.value = '';
  itemRowCount = 0;
  addItemRow();
  document.getElementById('createModal').classList.add('open');
};

window.addItemRow = function() {
  const idx = itemRowCount++;
  const opts = allProducts.map(p =>
    `<option value="${p.id}" data-price="${p.price}">${escHtml(p.name)}</option>`
  ).join('');
  const row = document.createElement('div');
  row.className = 'item-row';
  row.id = `irow${idx}`;
  // Select <div> ichida: searchableSelect qidiruv inputini select'ning OTA
  // elementiga qo'yadi — to'g'ridan-to'g'ri qatorga tushsa 4 ustunli grid
  // (mahsulot/miqdor/narx/tugma) surilib ketardi. O'ram faqat layout uchun,
  // `getElementById('ip..')` o'qishlari o'zgarmaydi.
  row.innerHTML = `
    <div>
      <select class="form-control" id="ip${idx}" onchange="calcTotal()" style="width:100%"><option value="">— Mahsulot —</option>${opts}</select>
    </div>
    <input class="form-control" type="number" id="iq${idx}" value="1" min="0.01" step="any" oninput="calcTotal()">
    <input class="form-control" type="number" id="ipr${idx}" value="" placeholder="narx" oninput="calcTotal()">
    <button class="btn btn-red btn-sm" onclick="removeRow(${idx})">✕</button>
  `;
  document.getElementById('cItems').appendChild(row);

  // Mahsulot tanlanganda narxni to'ldirish
  document.getElementById(`ip${idx}`).addEventListener('change', function() {
    const opt = this.options[this.selectedIndex];
    if (opt && opt.dataset.price) {
      document.getElementById(`ipr${idx}`).value = opt.dataset.price;
      calcTotal();
    }
  });

  // Qator DINAMIK yasaladi — shuning uchun qidiruv shu yerda ulanadi.
  // Listener'dan KEYIN: bitta natija qolganda komponent `change` yuboradi va
  // narx maydoni o'sha zahoti to'lishi kerak.
  attachProductSearch(document.getElementById(`ip${idx}`));
};

window.removeRow = function(idx) {
  document.getElementById(`irow${idx}`)?.remove();
  calcTotal();
};

window.calcTotal = function() {
  let total = 0;
  document.querySelectorAll('[id^="irow"]').forEach(row => {
    const id = row.id.replace('irow', '');
    const q = parseFloat(document.getElementById(`iq${id}`)?.value) || 0;
    const pr = parseFloat(document.getElementById(`ipr${id}`)?.value) || 0;
    total += q * pr;
  });
  document.getElementById('cTotal').textContent = total > 0 ? `Jami: ${fmtNum(total)} so'm` : '';
};

window.submitReturn = async function() {
  const items = [];
  let valid = true;
  document.querySelectorAll('[id^="irow"]').forEach(row => {
    const id = row.id.replace('irow', '');
    const pId = parseInt(document.getElementById(`ip${id}`)?.value);
    const qty = parseFloat(document.getElementById(`iq${id}`)?.value);
    const price = parseFloat(document.getElementById(`ipr${id}`)?.value);
    if (!pId || !qty || !price) { valid = false; return; }
    items.push({ product_id: pId, quantity: qty, unit_price: price, restore_to_inventory: true });
  });

  if (!items.length || !valid) {
    showToast('Barcha mahsulot ma\'lumotlarini to\'ldiring', 'error');
    return;
  }

  const payload = {
    reason: document.getElementById('cReason').value,
    refund_method: document.getElementById('cRefundMethod').value,
    notes: document.getElementById('cNotes').value || null,
    items,
  };
  const orderId = document.getElementById('cOrderId').value;
  const custId = document.getElementById('cCustomerId').value;
  if (orderId) payload.order_id = parseInt(orderId);
  if (custId) payload.customer_id = parseInt(custId);

  try {
    const r = await fetch(`${API}/returns/`, {
      method: 'POST', headers: h(), body: JSON.stringify(payload)
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      throw new Error(err.detail || 'Xato');
    }
    closeModal('createModal');
    showToast('Qaytarish yaratildi', 'success');
    load();
  } catch (e) {
    showToast(e.message || 'Xato yuz berdi', 'error');
  }
};

// ── TAFSILOT MODAL ──────────────────────────────────────────────────────────
window.openDetail = async function(id) {
  currentReturnId = id;
  document.getElementById('dBody').innerHTML = '<div class="loading">Yuklanmoqda...</div>';
  document.getElementById('dApproveBtn').style.display = 'none';
  document.getElementById('dRejectBtn').style.display = 'none';
  document.getElementById('detailModal').classList.add('open');

  try {
    const r = await fetch(`${API}/returns/${id}`, { headers: h() });
    const ret = await r.json();
    document.getElementById('dTitle').textContent = `Qaytarish — ${ret.return_number}`;

    if (ret.status === 'pending') {
      document.getElementById('dApproveBtn').style.display = '';
      document.getElementById('dRejectBtn').style.display = '';
    }

    const itemsHtml = ret.items.map(it => {
      const pName = allProducts.find(p => p.id === it.product_id)?.name || `Mahsulot #${it.product_id}`;
      return `
        <div class="detail-item-row">
          <span>${escHtml(pName)}</span>
          <span>${it.quantity} × ${fmtNum(it.unit_price)} = <b>${fmtNum(it.total)}</b> so'm</span>
        </div>
      `;
    }).join('');

    document.getElementById('dBody').innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem .75rem;font-size:.8125rem;margin-bottom:.75rem">
        <div><span style="color:var(--text3)">Holat:</span> <span class="badge badge-${ret.status}">${statusLabel(ret.status)}</span></div>
        <div><span style="color:var(--text3)">Sana:</span> ${fmtDate(ret.created_at)}</div>
        <div><span style="color:var(--text3)">Sabab:</span> ${REASON_LABELS[ret.reason] || ret.reason}</div>
        <div><span style="color:var(--text3)">Qaytarish:</span> ${REFUND_LABELS[ret.refund_method] || ret.refund_method}</div>
        <div><span style="color:var(--text3)">Mijoz:</span> ${ret.customer ? escHtml(ret.customer.name) : '—'}</div>
        <div><span style="color:var(--text3)">Buyurtma #:</span> ${ret.order_id || '—'}</div>
        ${ret.notes ? `<div colspan="2"><span style="color:var(--text3)">Izoh:</span> ${escHtml(ret.notes)}</div>` : ''}
      </div>
      <div class="detail-items">
        <div style="font-size:.75rem;font-weight:700;color:var(--text3);margin-bottom:.375rem;text-transform:uppercase">Mahsulotlar</div>
        ${itemsHtml}
        <div style="text-align:right;font-weight:700;color:var(--gold);margin-top:.5rem;font-size:.9rem">
          Jami: ${fmtNum(ret.total_amount)} so'm
        </div>
      </div>
    `;
  } catch {
    document.getElementById('dBody').innerHTML = '<div class="empty">Ma\'lumot yuklanmadi</div>';
  }
};

window.approveReturn = async function() {
  if (!confirm('Qaytarishni tasdiqlaysizmi? Tovar omborga qaytariladi.')) return;
  try {
    const r = await fetch(`${API}/returns/${currentReturnId}/approve`, { method: 'POST', headers: h() });
    if (!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || 'Xato');
    closeModal('detailModal');
    showToast('Qaytarish tasdiqlandi, tovar omborga qaytarildi', 'success');
    load();
  } catch (e) {
    showToast(e.message, 'error');
  }
};

window.rejectReturn = async function() {
  if (!confirm('Qaytarishni rad etasizmi?')) return;
  try {
    const r = await fetch(`${API}/returns/${currentReturnId}/reject`, { method: 'POST', headers: h() });
    if (!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || 'Xato');
    closeModal('detailModal');
    showToast('Qaytarish rad etildi', 'error');
    load();
  } catch (e) {
    showToast(e.message, 'error');
  }
};

// ── Utils ────────────────────────────────────────────────────────────────────
window.closeModal = function(id) { document.getElementById(id).classList.remove('open'); };
window.resetFilters = function() {
  ['fStatus','fFrom','fTo'].forEach(id => { document.getElementById(id).value = ''; });
  load();
};

function fmtNum(n) { return Number(n||0).toLocaleString('uz-UZ'); }
function fmtDate(s) {
  if (!s) return '—';
  const d = new Date(s);
  return `${d.getDate().toString().padStart(2,'0')}.${(d.getMonth()+1).toString().padStart(2,'0')}.${d.getFullYear()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
}
function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Close on overlay click
['createModal','detailModal'].forEach(id => {
  document.getElementById(id).addEventListener('click', e => {
    if (e.target === e.currentTarget) closeModal(id);
  });
});

init();
</script>
