[package]
name = "restopos"
version = "2.0.0"
description = "RestoPOS — Universal SaaS POS"
authors = ["RestoPOS Team"]
edition = "2021"

[lib]
name = "restopos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
