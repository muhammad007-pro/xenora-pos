<!DOCTYPE html>
<html lang="uz">
<head>
<script>/*XENORA_SERVER_CAP*/if(window.Capacitor&&!window.XENORA_SERVER)window.XENORA_SERVER='https://xenora.uz';</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ichki Ko'chirish — XENORA</title>
<link rel="stylesheet" href="../css/main.css">
<style>
/* SELF-CONTAINED tema - /css/main.css YO'Q (404). Orphaned --var (zumrad-tilla). */
:root{--surface1:#0a1628;--surface2:#0f2038;--surface3:#16294a;--text1:#e8eef5;--text2:#8b9bb0;--text3:#6b7d94;--primary:#0d9488;--accent:#22c55e;--border:rgba(34,197,94,.18);--bg:#070f1e;}
[data-theme="light"]{--surface1:#ffffff;--surface2:#eef2f9;--surface3:#e6ecf6;--text1:#0f2038;--text2:#5a6b82;--text3:#677689;--primary:#0a7d72;--accent:#0a7d72;--border:rgba(0,0,0,.1);--bg:#f4f6fb;}
body{font-family:'Inter',system-ui,sans-serif;color:var(--text1)}
.layout{display:flex;min-height:100vh}.main-content{flex:1;min-width:0;padding:1.5rem;max-width:1180px;margin:0 auto;width:100%}
.btn{display:inline-flex;align-items:center;gap:.375rem;padding:.5rem 1.1rem;border-radius:.5rem;font-size:.875rem;font-weight:600;cursor:pointer;border:1px solid transparent;background:linear-gradient(135deg,#16a34a,#22c55e,#16a34a);color:#04160d;font-family:inherit;transition:.2s}
.btn:hover{box-shadow:0 0 16px rgba(34,197,94,.35);transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.btn.btn-secondary,.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text2)}
.inp,input,select,textarea{background:var(--surface2);border:1px solid var(--border);border-radius:.5rem;padding:.5rem .75rem;color:var(--text1);font-size:.875rem;outline:none;font-family:inherit}
</style>
<style>
  .page-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.5rem; }
  .page-title  { font-size:1.25rem; font-weight:700; }
  .filter-bar  { display:flex; gap:.75rem; flex-wrap:wrap; margin-bottom:1.25rem; align-items:flex-end; }
  .table-wrap  { overflow-x:auto; }
  table.data-table { width:100%; border-collapse:collapse; font-size:.875rem; }
  .data-table th { background:var(--surface2); color:var(--text2); font-weight:600; padding:.625rem 1rem;
                   text-align:left; border-bottom:2px solid var(--border); white-space:nowrap; }
  .data-table td { padding:.5rem 1rem; border-bottom:1px solid var(--border); vertical-align:middle; }
  .data-table tr:hover td { background:var(--surface2); }
  .badge { display:inline-block; padding:.2rem .5rem; border-radius:.375rem; font-size:.75rem; font-weight:700; }
  .badge-draft   { background:#fef3c7; color:#92400e; }
  .badge-confirm { background:#d1fae5; color:#065f46; }
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:999; align-items:center; justify-content:center; }
  .modal-overlay.active { display:flex; }
  .modal-box  { background:var(--surface1); border-radius:1rem; padding:1.5rem; max-width:680px; width:96%; max-height:92vh; overflow-y:auto; }
  .modal-title{ font-size:1.125rem; font-weight:700; margin-bottom:1.25rem; }
  .form-row   { margin-bottom:.875rem; }
  .form-label { font-size:.8125rem; color:var(--text2); margin-bottom:.375rem; display:block; }
  .form-grid  { display:grid; grid-template-columns:1fr 1fr; gap:.75rem; }
  .item-row   { display:grid; grid-template-columns:2fr 1fr 1fr auto; gap:.5rem; align-items:end; margin-bottom:.5rem; }
  .branch-arrow { display:flex; align-items:center; justify-content:center; font-size:1.5rem; color:var(--accent); }
</style>
<link rel="stylesheet" href="../styles/premium-overlay.css">
<!-- Mobil qatlam - ENG OXIRGI stil (faqat @media max-width ichida ishlaydi) -->
<link rel="stylesheet" href="../styles/mobile.css">
</head>
<body>
<div class="xa-atmos" aria-hidden="true"></div>
<div class="layout">
  <div id="sidebar-container"></div>
  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">🚚 Ichki Ko'chirish (Peremeshcheniye)</h1>
      <button class="btn" id="btnAdd">+ Ko'chirma yaratish</button>
    </div>

    <div class="filter-bar">
      <div>
        <label class="form-label">Holat</label>
        <select class="inp" id="filterStatus" style="width:140px" onchange="load()">
          <option value="">Barchasi</option>
          <option value="draft">Qoralama</option>
          <option value="confirmed">Tasdiqlangan</option>
        </select>
      </div>
      <div>
        <label class="form-label">Dan</label>
        <input type="date" class="inp" id="filterFrom" style="width:145px" onchange="load()">
      </div>
      <div>
        <label class="form-label">Gacha</label>
        <input type="date" class="inp" id="filterTo" style="width:145px" onchange="load()">
      </div>
    </div>

    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr><th>#</th><th>Sana</th><th>Qayerdan</th><th>Qayerga</th><th>Tovarlar</th><th>Holat</th><th></th></tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="7" style="text-align:center;padding:2rem;color:var(--text3)">Yuklanmoqda...</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<!-- Yangi ko'chirma modali -->
<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="modal-title">Filiallar orasida tovar ko'chirish</div>

    <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:.75rem;align-items:end;margin-bottom:.75rem">
      <div class="form-row" style="margin:0">
        <label class="form-label">Qayerdan (filial) *</label>
        <select class="inp" id="fFromBranch">
          <option value="">Asosiy filial</option>
        </select>
      </div>
      <div class="branch-arrow">→</div>
      <div class="form-row" style="margin:0">
        <label class="form-label">Qayerga (filial) *</label>
        <select class="inp" id="fToBranch">
          <option value="">Asosiy filial</option>
        </select>
      </div>
    </div>

    <div class="form-grid">
      <div class="form-row">
        <label class="form-label">Sana *</label>
        <input type="date" class="inp" id="fDate">
      </div>
      <div class="form-row">
        <label class="form-label">Izoh</label>
        <input type="text" class="inp" id="fNotes" placeholder="Ixtiyoriy...">
      </div>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem">
      <label class="form-label" style="margin:0;font-weight:700">Ko'chiriladigan tovarlar</label>
      <button type="button" class="btn btn-secondary" style="padding:.25rem .625rem;font-size:.8125rem" onclick="addItemRow()">+ Tovar qo'shish</button>
    </div>
    <div style="display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:.5rem;margin-bottom:.25rem">
      <span style="font-size:.75rem;color:var(--text3);padding-left:.25rem">Tovar</span>
      <span style="font-size:.75rem;color:var(--text3)">Miqdor</span>
      <span style="font-size:.75rem;color:var(--text3)">Narx (so'm)</span>
      <span></span>
    </div>
    <div id="itemRows"></div>

    <div style="display:flex;gap:.75rem;justify-content:flex-end;margin-top:1.25rem">
      <button class="btn btn-secondary" onclick="closeModal()">Bekor</button>
      <button class="btn" id="btnSave" onclick="save()">Saqlash (Qoralama)</button>
    </div>
  </div>
</div>

<!-- Detail modal -->
<div class="modal-overlay" id="detailModal">
  <div class="modal-box" style="max-width:580px">
    <div class="modal-title" id="detailTitle">Ko'chirma tafsiloti</div>
    <div id="detailContent"></div>
    <div style="display:flex;gap:.75rem;justify-content:flex-end;margin-top:1.25rem">
      <button class="btn btn-secondary" onclick="closeDetail()">Yopish</button>
      <button class="btn" id="btnConfirmTr" style="display:none;background:#22c55e" onclick="confirmTransfer()">✓ Tasdiqlash (Inventoryni yangilash)</button>
    </div>
  </div>
</div>

<script type="module">
import { Sidebar } from '../js/core/sidebar.js';
import { API } from '../js/core/api.js';
Sidebar.init();
const api = new API();
let products = [];
let branches  = [];
let detailId  = null;

async function init() {
  const today = new Date().toISOString().slice(0,10);
  document.getElementById('fDate').value      = today;
  document.getElementById('filterFrom').value = today.slice(0,7)+'-01';
  document.getElementById('filterTo').value   = today;

  const [prodRes, branchRes] = await Promise.all([
    api.get('/products/?page_size=500'),
    api.get('/branches/?page_size=50'),
  ]);
  products = prodRes.items || [];
  branches  = branchRes.items || branchRes || [];

  const branchOpts = branches.map(b=>`<option value="${b.id}">${b.name}</option>`).join('');
  document.getElementById('fFromBranch').insertAdjacentHTML('beforeend', branchOpts);
  document.getElementById('fToBranch').insertAdjacentHTML('beforeend', branchOpts);

  load();
}

window.load = async () => {
  const p = new URLSearchParams({ page_size: 50 });
  const s = document.getElementById('filterStatus').value;
  const f = document.getElementById('filterFrom').value;
  const t = document.getElementById('filterTo').value;
  if (s) p.set('status', s);
  if (f) p.set('date_from', f);
  if (t) p.set('date_to', t);
  const res = await api.get(`/internal-transfers/?${p}`);
  const rows = res.items || [];
  const tbody = document.getElementById('tableBody');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:2rem;color:var(--text3)">Ko\'chirmalar topilmadi</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(tr => `
    <tr style="cursor:pointer" onclick="openDetail(${tr.id})">
      <td style="font-family:monospace;font-weight:700">#${tr.id}</td>
      <td>${tr.transfer_date}</td>
      <td style="color:#ef4444">${tr.from_branch_name||'Asosiy filial'}</td>
      <td style="color:#22c55e">${tr.to_branch_name||'Asosiy filial'}</td>
      <td>${tr.items?.length||0} tovar</td>
      <td><span class="badge ${tr.status==='confirmed'?'badge-confirm':'badge-draft'}">${tr.status==='confirmed'?'Tasdiqlangan':'Qoralama'}</span></td>
      <td onclick="event.stopPropagation()">
        ${tr.status==='draft'?`<button class="btn btn-secondary" style="padding:.2rem .5rem;font-size:.75rem;color:#ef4444" onclick="event.stopPropagation();deleteDraft(${tr.id})">O'chirish</button>`:''}
      </td>
    </tr>`).join('');
};

window.openDetail = async (id) => {
  detailId = id;
  const tr = await api.get(`/internal-transfers/${id}`);
  document.getElementById('detailTitle').textContent = `Ko'chirma #${tr.id}`;
  document.getElementById('detailContent').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:.5rem;align-items:center;margin-bottom:1rem;padding:.75rem;background:var(--surface2);border-radius:.5rem">
      <div style="text-align:center"><div style="font-size:.75rem;color:var(--text3)">Qayerdan</div><div style="font-weight:700;color:#ef4444">${tr.from_branch_name||'Asosiy filial'}</div></div>
      <div style="font-size:1.5rem;text-align:center">→</div>
      <div style="text-align:center"><div style="font-size:.75rem;color:var(--text3)">Qayerga</div><div style="font-weight:700;color:#22c55e">${tr.to_branch_name||'Asosiy filial'}</div></div>
    </div>
    <div style="display:flex;gap:1.5rem;margin-bottom:.75rem;font-size:.875rem">
      <div><span style="color:var(--text3)">Sana: </span><strong>${tr.transfer_date}</strong></div>
      <div><span class="badge ${tr.status==='confirmed'?'badge-confirm':'badge-draft'}">${tr.status==='confirmed'?'Tasdiqlangan':'Qoralama'}</span></div>
    </div>
    ${tr.notes ? `<div style="margin-bottom:.75rem;font-size:.875rem;color:var(--text2)">Izoh: ${tr.notes}</div>` : ''}
    <table class="data-table">
      <thead><tr><th>Tovar</th><th>Miqdor</th><th>Narx</th></tr></thead>
      <tbody>${tr.items.map(it=>`<tr>
        <td style="font-weight:600">${it.product_name||'#'+it.product_id}</td>
        <td>${it.quantity}</td>
        <td>${fmt(it.cost_price)}</td>
      </tr>`).join('')}</tbody>
    </table>`;
  document.getElementById('btnConfirmTr').style.display = tr.status === 'draft' ? '' : 'none';
  document.getElementById('detailModal').classList.add('active');
};

window.confirmTransfer = async () => {
  const res = await api.post(`/internal-transfers/${detailId}/confirm`, {});
  if (res.status === 'confirmed') {
    showToast("Ko'chirma tasdiqlandi, inventory yangilandi", 'success');
    closeDetail(); load();
  } else showToast(res.detail||'Xatolik','error');
};

window.deleteDraft = async (id) => {
  if (!confirm("Qoralamani o'chirasizmi?")) return;
  const res = await api.delete(`/internal-transfers/${id}`);
  if (res.message) { showToast("O'chirildi",'success'); load(); }
  else showToast(res.detail||'Xatolik','error');
};

document.getElementById('btnAdd').onclick = () => {
  document.getElementById('fNotes').value = '';
  document.getElementById('fFromBranch').value = '';
  document.getElementById('fToBranch').value   = '';
  document.getElementById('itemRows').innerHTML = '';
  addItemRow();
  document.getElementById('modal').classList.add('active');
};
window.closeModal  = () => document.getElementById('modal').classList.remove('active');
window.closeDetail = () => document.getElementById('detailModal').classList.remove('active');
document.getElementById('modal').onclick       = e => { if(e.target===e.currentTarget) closeModal(); };
document.getElementById('detailModal').onclick = e => { if(e.target===e.currentTarget) closeDetail(); };

window.addItemRow = () => {
  const opts = products.map(p=>`<option value="${p.id}" data-cost="${p.cost_price||p.price||0}">${p.name}</option>`).join('');
  const div  = document.createElement('div');
  div.className = 'item-row';
  div.innerHTML = `
    <div><select class="inp prod-sel">${opts}</select></div>
    <div><input type="number" class="inp qty-inp" value="1" min="0.001" step="0.001"></div>
    <div><input type="number" class="inp price-inp" value="0" min="0"></div>
    <div><button type="button" class="btn btn-secondary" style="padding:.35rem .625rem;color:#ef4444" onclick="this.closest('.item-row').remove()">✕</button></div>`;
  document.getElementById('itemRows').appendChild(div);
  const sel = div.querySelector('.prod-sel');
  const priceInp = div.querySelector('.price-inp');
  sel.onchange = () => { priceInp.value = sel.options[sel.selectedIndex].dataset.cost || 0; };
  if (sel.options[0]) priceInp.value = sel.options[0].dataset.cost || 0;
};

window.save = async () => {
  const from  = document.getElementById('fFromBranch').value;
  const to    = document.getElementById('fToBranch').value;
  if (from && to && from === to) { showToast("Bir xil filiallar orasida ko'chirish mumkin emas",'error'); return; }
  const rows = document.querySelectorAll('.item-row');
  if (!rows.length) { showToast('Tovar qo\'shilsin','error'); return; }
  const items = [];
  rows.forEach(row => {
    const prodId = parseInt(row.querySelector('.prod-sel').value);
    const qty    = parseFloat(row.querySelector('.qty-inp').value);
    const price  = parseFloat(row.querySelector('.price-inp').value);
    if (prodId && qty) items.push({ product_id: prodId, quantity: qty, cost_price: price });
  });
  if (!items.length) { showToast('Tovar ma\'lumotlarini to\'ldiring','error'); return; }
  const btn = document.getElementById('btnSave');
  btn.disabled = true;
  const res = await api.post('/internal-transfers/', {
    from_branch_id: from ? parseInt(from) : null,
    to_branch_id:   to   ? parseInt(to)   : null,
    transfer_date:  document.getElementById('fDate').value,
    notes:          document.getElementById('fNotes').value.trim() || null,
    items,
  });
  btn.disabled = false;
  if (res.id) { showToast("Ko'chirma saqlandi",'success'); closeModal(); load(); }
  else showToast(res.detail||'Xatolik','error');
};

function fmt(n) { return Number(n||0).toLocaleString('uz-UZ'); }
function showToast(msg, type='info') {
  const el = document.createElement('div');
  el.style.cssText = `position:fixed;bottom:1.5rem;right:1.5rem;z-index:9999;padding:.75rem 1.25rem;border-radius:.625rem;color:#fff;background:${type==='success'?'#22c55e':type==='error'?'#ef4444':'#3b82f6'};font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.3)`;
  el.textContent = msg; document.body.appendChild(el);
  setTimeout(()=>el.remove(),3000);
}

init();
</script>
</body>
</html>
