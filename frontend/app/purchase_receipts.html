<style>
/* SELF-CONTAINED tema - /css/main.css YO'Q (404). Orphaned --var (zumrad-tilla). */
:root{--surface1:#0a1628;--surface2:#0f2038;--surface3:#16294a;--text1:#e8eef5;--text2:#8b9bb0;--text3:#6b7d94;--primary:#0d9488;--accent:#22c55e;--border:rgba(34,197,94,.18);--bg:#070f1e;}
[data-theme="light"]{--surface1:#ffffff;--surface2:#eef2f9;--surface3:#e6ecf6;--text1:#0f2038;--text2:#5a6b82;--text3:#677689;--primary:#0a7d72;--accent:#0a7d72;--border:rgba(0,0,0,.1);--bg:#f4f6fb;}
body{font-family:'Inter',system-ui,sans-serif;color:var(--text1)}
.layout{display:flex;min-height:100vh}.main-content{flex:1;min-width:0;padding:1.5rem;max-width:1180px;margin:0 auto;width:100%}
.btn{display:inline-flex;align-items:center;gap:.375rem;padding:.5rem 1.1rem;border-radius:.5rem;font-size:.875rem;font-weight:600;cursor:pointer;border:1px solid transparent;background:linear-gradient(135deg,#16a34a,#22c55e,#16a34a);color:#04160d;font-family:inherit;transition:.2s}
.btn:hover{box-shadow:0 0 16px rgba(34,197,94,.35);transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.btn.btn-secondary,.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text2)}
.inp,input,select,textarea{background:var(--surface2);border:1px solid var(--border);border-radius:.5rem;padding:.5rem .75rem;color:var(--text1);font-size:.875rem;outline:none;font-family:inherit}
</style>
<style>
  .page-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.5rem; }
  .page-title  { font-size:1.25rem; font-weight:700; }
  .filter-bar  { display:flex; gap:.75rem; flex-wrap:wrap; margin-bottom:1.25rem; align-items:flex-end; }
  .table-wrap  { overflow-x:auto; }
  table.data-table { width:100%; border-collapse:collapse; font-size:.875rem; }
  .data-table th { background:var(--surface2); color:var(--text2); font-weight:600; padding:.625rem 1rem;
                   text-align:left; border-bottom:2px solid var(--border); white-space:nowrap; }
  .data-table td { padding:.5rem 1rem; border-bottom:1px solid var(--border); vertical-align:middle; }
  .data-table tr:hover td { background:var(--surface2); }
  .badge { display:inline-block; padding:.2rem .5rem; border-radius:.375rem; font-size:.75rem; font-weight:700; }
  .badge-draft     { background:#fef3c7; color:#92400e; }
  .badge-confirmed { background:#d1fae5; color:#065f46; }
  .badge-paid      { background:#dbeafe; color:#1e40af; }
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:999; align-items:flex-start; justify-content:center; overflow-y:auto; padding:2rem 0; }
  .modal-overlay.active { display:flex; }
  .modal-box  { background:var(--surface1); border-radius:1rem; padding:1.5rem; max-width:740px; width:94%; margin:auto; }
  .modal-title{ font-size:1.125rem; font-weight:700; margin-bottom:1.25rem; }
  .form-row   { margin-bottom:.875rem; }
  .form-label { font-size:.8125rem; color:var(--text2); margin-bottom:.375rem; display:block; }
  .form-grid  { display:grid; grid-template-columns:1fr 1fr; gap:.75rem; }
  .form-grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:.75rem; }
  .items-table { width:100%; border-collapse:collapse; font-size:.8125rem; margin-top:.5rem; }
  .items-table th { background:var(--surface2); padding:.375rem .625rem; text-align:left; font-weight:600; }
  .items-table td { padding:.375rem .5rem; border-bottom:1px solid var(--border); }
  .items-table input { width:100%; padding:.25rem .375rem; border:1px solid var(--border); border-radius:.375rem;
                       background:var(--surface1); color:var(--text1); font-size:.8125rem; }
  .remove-btn { background:none; border:none; color:#ef4444; cursor:pointer; font-size:1rem; padding:0 .25rem; }
  .detail-modal { max-width:820px; }
  .detail-items { margin-top:1rem; }
  .detail-row  { display:flex; justify-content:space-between; padding:.375rem 0; border-bottom:1px solid var(--border); font-size:.875rem; }
  .detail-row:last-child { border:none; }
  .total-row   { font-weight:700; font-size:1rem; color:var(--accent); }
  .confirm-bar { background:var(--surface2); border-radius:.625rem; padding:.75rem 1rem; display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem; }
</style>

<div class="layout">
  <div id="sidebar-container"></div>

    <a href="admin.html" style="display:inline-block;margin-bottom:1rem;color:var(--text2);text-decoration:none;font-size:.875rem">← Admin panel</a>
    <div class="page-header">
      <h1 class="page-title">📋 Priyomka (Qabul akti)</h1>

    <div class="filter-bar">
      <div>
        <label class="form-label">Firma</label>

</div>

<!-- Yangi priyomka modali -->
<div class="modal-overlay" id="newModal">
  <div class="modal-box">
    <div class="modal-title">Yangi nakladnoy kiritish</div>
    <div class="form-grid">
      <div class="form-row">
        <label class="form-label">Firma *</label>
        <select class="inp" id="nSupplier"></select>
      </div>
      <div class="form-row">
        <label class="form-label">Sana *</label>
        <input type="date" class="inp" id="nDate">
      </div>
    </div>
    <div class="form-grid">
      <div class="form-row">
        <label class="form-label">Nakladnoy raqami</label>
        <input type="text" class="inp" id="nInvoice" placeholder="NL-001">
      </div>
      <div class="form-row">
        <label class="form-label">Chegirma (UZS)</label>

    </div>
    <div class="form-row">
      <label class="form-label">Izoh</label>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem;margin-top:1rem">

      <button class="btn btn-secondary" style="padding:.3rem .75rem;font-size:.8125rem" onclick="addItemRow()">+ Tovar</button>
    </div>
    <!-- Barkod skaner (faqat barcode flagi yoqilganda) -->
    <div class="form-row" id="scanRow" style="display:none">
      <label class="form-label">📷 Barkod skaner (F2) — skaner qilsangiz tovar avtomatik qo'shiladi</label>
      <div style="display:flex;gap:.5rem;align-items:center">
        <input type="text" class="inp" id="scanInput" placeholder="Barkodni skaner qiling yoki kiriting..." autocomplete="off" style="flex:1">
        <span id="scanStatus" style="font-size:.8125rem;font-weight:600;white-space:nowrap"></span>
      </div>
    </div>
    <table class="items-table" id="itemsTable">
      <thead><tr>
        <th style="min-width:180px">Tovar *</th>
        <th style="width:90px">Miqdor *</th>
        <th style="width:110px">Kelish narxi *</th>
        <th style="width:80px">Brak</th>
        <th style="width:100px">Summa</th>
        <th style="width:120px">Partiya №</th>
        <th style="width:140px">Muddat</th>
        <th style="width:30px"></th>
      </tr></thead>
      <tbody id="itemsBody"></tbody>
    </table>
    <div style="text-align:right;margin-top:.5rem;font-size:.875rem;color:var(--text2)">
      Jami: <strong id="totalLabel">0</strong> so'm
      &nbsp;|&nbsp; Net: <strong id="netLabel">0</strong> so'm
    </div>

    <div style="display:flex;gap:.75rem;justify-content:flex-end;margin-top:1.25rem">
      <button class="btn btn-secondary" onclick="closeNewModal()">Bekor</button>
      <button class="btn" id="btnCreate" onclick="createReceipt()">Saqlash (Draft)</button>
    </div>
  </div>
</div>

<!-- Detail modali -->
<div class="modal-overlay" id="detailModal">
  <div class="modal-box detail-modal">
    <div id="detailContent"></div>
    <div style="display:flex;gap:.75rem;justify-content:flex-end;margin-top:1rem">
      <button class="btn btn-secondary" onclick="closeDetailModal()">Yopish</button>

<!-- Yangi tovar modali (skaner topilmaganda) -->
<div class="modal-overlay" id="npModal">
  <div class="modal-box" style="max-width:440px">
    <div class="modal-title">🆕 Yangi tovar (skaner)</div>
    <div class="form-row">
      <label class="form-label">Barkod</label>
      <input type="text" class="inp" id="npBarcode" readonly style="opacity:.75">

    <div class="form-row">
      <label class="form-label">Nomi *</label>

      <div class="form-row">

      </div>

      <input type="file" class="inp" id="npImage" accept="image/*">

    </div>
    <!-- Bosqich 4: boshlang'ich qoldiq shu yerga -->
    <div style="display:flex;gap:.75rem;justify-content:flex-end;margin-top:1.25rem">

      <button class="btn" id="npSaveBtn" onclick="saveNewProduct()">Saqlash + kirim</button>
    </div>

</div>

<script type="module">
import { Sidebar } from '../js/core/sidebar.js';
import { API } from '../js/core/api.js';
import { features } from '../js/core/features.js';
Sidebar.init();
const api = new API();
let products = [];
let suppliers = [];
let categories = [];
let currentReceiptId = null;

async function init() {
  const today = new Date().toISOString().slice(0,10);
  document.getElementById('nDate').value = today;
  document.getElementById('filterFrom').value = today.slice(0,7) + '-01';
  document.getElementById('filterTo').value = today;

  const [supRes, prodRes, catRes] = await Promise.all([
    api.get('/suppliers-b2b/?page_size=200&is_active=true'),
    api.get('/products/?page_size=500'),
    api.get('/categories/all').catch(() => null),
  ]);
  suppliers  = supRes.items || [];
  products   = prodRes.items || [];
  categories = Array.isArray(catRes) ? catRes : (catRes?.items || catRes?.data || []);

  const selSup = document.getElementById('filterSupplier');
  const nSup   = document.getElementById('nSupplier');
  suppliers.forEach(s => {
    selSup.insertAdjacentHTML('beforeend', `<option value="${s.id}">${s.name}</option>`);
    nSup.insertAdjacentHTML('beforeend',  `<option value="${s.id}">${s.name}</option>`);
  });
  addItemRow();
  load();

  // Barkod skaner UI — faqat barcode flagi yoqilgan tenantlarda
  try { await features.init(); } catch {}
  if (features.has('barcode') || features.has('multi_barcode')) {
    document.getElementById('scanRow').style.display = '';
  }
}

window.load = async () => {
  const params = new URLSearchParams({ page_size: 100 });
  const sup    = document.getElementById('filterSupplier').value;
  const status = document.getElementById('filterStatus').value;
  const from   = document.getElementById('filterFrom').value;
  const to     = document.getElementById('filterTo').value;
  if (sup)    params.set('supplier_id', sup);
  if (status) params.set('status', status);
  if (from)   params.set('date_from', from);
  if (to)     params.set('date_to', to);
  const res = await api.get(`/purchase-receipts/?${params}`);
  const rows = res.items || [];
  const tbody = document.getElementById('tableBody');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:2rem;color:var(--text3)">Priyomkalar topilmadi</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(r => `
    <tr>
      <td>${r.id}</td>
      <td>${r.receipt_date}</td>
      <td style="font-weight:600">${r.supplier_name || '—'}</td>
      <td style="font-family:monospace">${r.invoice_number || '—'}</td>
      <td style="text-align:right">${fmt(r.total_amount)}</td>
      <td style="text-align:right;font-weight:700">${fmt(r.net_amount)}</td>
      <td><span class="badge badge-${r.status}">${statusLabel(r.status)}</span></td>
      <td>
        <button class="btn btn-secondary" style="padding:.25rem .625rem;font-size:.75rem" onclick="openDetail(${r.id})">Ko'rish</button>
      </td>
    </tr>`).join('');
};

window.addItemRow = () => {
  const tbody = document.getElementById('itemsBody');
  const idx   = tbody.rows.length;
  const opts  = products.map(p => `<option value="${p.id}" data-price="${p.price || 0}">${p.name}</option>`).join('');
  const row = tbody.insertRow();
  row.innerHTML = `
    <td><select class="inp" style="width:100%" onchange="calcRow(this)">${opts}</select></td>
    <td><input type="number" min="0.001" step="0.001" value="1" oninput="calcRow(this)"></td>
    <td><input type="number" min="0" step="1" value="" placeholder="narx" oninput="calcRow(this)"></td>
    <td><input type="number" min="0" step="0.001" value="0" oninput="calcRow(this)"></td>
    <td class="row-total" style="text-align:right;font-weight:600">0</td>
    <td><input type="text" placeholder="seriya" style="width:100%"></td>
    <td><input type="date" style="width:100%"></td>
    <td><button class="remove-btn" onclick="this.closest('tr').remove();calcTotal()">✕</button></td>`;
};

window.calcRow = (el) => {
  const row  = el.closest('tr');
  const qty  = parseFloat(row.cells[1].querySelector('input').value) || 0;
  const price= parseFloat(row.cells[2].querySelector('input').value) || 0;
  const brak = parseFloat(row.cells[3].querySelector('input').value) || 0;
  const acc  = Math.max(0, qty - brak);
  row.cells[4].textContent = fmt(acc * price);
  calcTotal();
};

function calcTotal() {
  let total = 0;
  document.querySelectorAll('#itemsBody tr').forEach(row => {
    const qty  = parseFloat(row.cells[1].querySelector('input').value) || 0;
    const price= parseFloat(row.cells[2].querySelector('input').value) || 0;
    const brak = parseFloat(row.cells[3].querySelector('input').value) || 0;
    total += Math.max(0, qty - brak) * price;
  });
  const disc = parseFloat(document.getElementById('nDiscount').value) || 0;
  document.getElementById('totalLabel').textContent = fmt(total);
  document.getElementById('netLabel').textContent   = fmt(Math.max(0, total - disc));
}

document.getElementById('nDiscount').oninput = calcTotal;

window.createReceipt = async () => {
  const supplierId = document.getElementById('nSupplier').value;
  const date       = document.getElementById('nDate').value;
  if (!supplierId || !date) { showToast('Firma va sana kiritilishi shart', 'error'); return; }

  const items = [];
  let ok = true;
  document.querySelectorAll('#itemsBody tr').forEach(row => {
    const productId = row.cells[0].querySelector('select').value;
    const qty       = parseFloat(row.cells[1].querySelector('input').value) || 0;
    const price     = parseFloat(row.cells[2].querySelector('input').value) || 0;
    const brak      = parseFloat(row.cells[3].querySelector('input').value) || 0;
    const batch     = row.cells[5].querySelector('input').value.trim();
    const expiry    = row.cells[6].querySelector('input').value;
    if (!productId || qty <= 0 || price <= 0) { ok = false; return; }
    items.push({
      product_id: parseInt(productId), quantity: qty, unit_price: price, brak_qty: brak,
      batch_number: batch || null, expiry_date: expiry || null,
    });
  });
  if (!ok || !items.length) { showToast('Tovarlarni to\'liq kiriting', 'error'); return; }

  const btn = document.getElementById('btnCreate');
  btn.disabled = true;
  const res = await api.post('/purchase-receipts/', {
    supplier_id:     parseInt(supplierId),
    invoice_number:  document.getElementById('nInvoice').value.trim() || null,
    receipt_date:    date,
    discount_amount: parseFloat(document.getElementById('nDiscount').value) || 0,
    notes:           document.getElementById('nNotes').value.trim() || null,
    items,
  });
  btn.disabled = false;
  if (res.id) {
    showToast('Priyomka saqlandi', 'success');
    closeNewModal();
    load();
  } else {
    showToast(res.detail || 'Xatolik', 'error');
  }
};

window.openDetail = async (id) => {
  currentReceiptId = id;
  const rec = await api.get(`/purchase-receipts/${id}`);
  const content = document.getElementById('detailContent');
  const btnConfirm = document.getElementById('btnConfirm');

  btnConfirm.style.display = rec.status === 'draft' ? '' : 'none';

  content.innerHTML = `
    <div class="confirm-bar">
      <div>
        <div style="font-weight:700;font-size:1rem">${rec.supplier_name || 'Firma'} — ${rec.receipt_date}</div>
        <div style="font-size:.8125rem;color:var(--text3)">Nakladnoy: ${rec.invoice_number || '—'} | Holat: <span class="badge badge-${rec.status}">${statusLabel(rec.status)}</span></div>
      </div>
      <div style="text-align:right">
        <div style="font-size:.875rem;color:var(--text2)">Jami: ${fmt(rec.total_amount)}</div>
        <div style="font-size:1.125rem;font-weight:700;color:var(--accent)">Net: ${fmt(rec.net_amount)}</div>
      </div>
    </div>
    <div class="detail-items">
      ${(rec.items||[]).map(it => `
        <div class="detail-row">
          <span>${it.product_name || 'Mahsulot #'+it.product_id}</span>
          <span style="color:var(--text2);font-size:.8125rem">${it.quantity} × ${fmt(it.unit_price)} (brak: ${it.brak_qty})</span>
          <span style="font-weight:600">${fmt(it.total_price)}</span>
        </div>`).join('')}
      <div class="detail-row total-row">
        <span>JAMI NET</span>
        <span></span>
        <span>${fmt(rec.net_amount)}</span>
      </div>
    </div>
    ${rec.notes ? `<div style="margin-top:.75rem;font-size:.875rem;color:var(--text2)">Izoh: ${rec.notes}</div>` : ''}`;

  document.getElementById('detailModal').classList.add('active');
};

window.confirmReceipt = async () => {
  if (!confirm('Priyomkani tasdiqlashni va ombor qoldiqlarini to\'ldirishni tasdiqlaysizmi?')) return;
  const btn = document.getElementById('btnConfirm');
  btn.disabled = true;
  const res = await api.post(`/purchase-receipts/${currentReceiptId}/confirm`);
  btn.disabled = false;
  if (res.status === 'confirmed') {
    showToast('Priyomka tasdiqlandi! Ombor yangilandi.', 'success');
    closeDetailModal();
    load();
  } else {
    showToast(res.detail || 'Xatolik', 'error');
  }
};

window.closeNewModal = () => {
  document.getElementById('newModal').classList.remove('active');
  document.getElementById('itemsBody').innerHTML = '';
  addItemRow();
};
window.closeDetailModal = () => document.getElementById('detailModal').classList.remove('active');
document.getElementById('newModal').onclick   = e => { if (e.target===e.currentTarget) closeNewModal(); };
document.getElementById('detailModal').onclick = e => { if (e.target===e.currentTarget) closeDetailModal(); };
document.getElementById('npModal').onclick     = e => { if (e.target===e.currentTarget) document.getElementById('npModal').classList.remove('active'); };
document.getElementById('btnNew').onclick = () => document.getElementById('newModal').classList.add('active');

// ── Barkod skaner (POS handleBarcodeScan namunasi) ──────────────────────────────
const scanInput = document.getElementById('scanInput');
scanInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); const code = scanInput.value.trim(); scanInput.value=''; if (code) handleReceiptScan(code); }
});
// F2 → skaner inputiga fokus (modal ochiq bo'lsa)
document.addEventListener('keydown', e => {
  if (e.key === 'F2' && document.getElementById('newModal').classList.contains('active')
      && document.getElementById('scanRow').style.display !== 'none') {
    e.preventDefault(); scanInput.focus();
  }
});

async function handleReceiptScan(code) {
  const st = document.getElementById('scanStatus');
  st.textContent = 'Qidirilmoqda...'; st.style.color = 'var(--text3)';
  // 1) Xotiradagi mahsulotlardan
  let prod = products.find(p => p.barcode === code);
  // 2) Ko'p barcode tizimi orqali (multi-barcode + tarozi PLU)
  if (!prod) {
    try { const r = await api.get(`/barcodes/lookup/${encodeURIComponent(code)}`); if (r && r.id) prod = r; } catch {}
  }
  if (!prod) {
    st.textContent = `✕ Topilmadi: ${code}`; st.style.color = '#ef4444';
    onReceiptProductNotFound(code);   // 2-bosqich: yangi tovar formasi
    return;
  }
  st.textContent = `✓ ${prod.name}`; st.style.color = '#22c55e';
  addScannedProduct(prod);
}

// Tovarni kirim qatoriga qo'shish (skanerdan yoki yangi yaratilgach)
function addScannedProduct(prod) {
  if (!products.find(p => p.id === prod.id)) products.push(prod);

  // Shu tovar qatorda bormi? → miqdorni +1; yo'q bo'lsa bo'sh qatorni ishlat yoki yangi
  let targetRow = null;
  document.querySelectorAll('#itemsBody tr').forEach(row => {
    const sel = row.cells[0].querySelector('select');
    if (sel && String(sel.value) === String(prod.id)) targetRow = row;
  });
  if (targetRow) {
    const qi = targetRow.cells[1].querySelector('input');
    qi.value = (parseFloat(qi.value) || 0) + 1;
    calcRow(qi);
    qi.focus();
    return;
  }
  // Narx kiritilmagan bo'sh qatorni qayta ishlatamiz, bo'lmasa yangi qo'shamiz
  let row = [...document.querySelectorAll('#itemsBody tr')].find(r => !r.cells[2].querySelector('input').value);
  if (!row) { addItemRow(); row = document.getElementById('itemsBody').lastElementChild; }
  const sel = row.cells[0].querySelector('select');
  if (!sel.querySelector(`option[value="${prod.id}"]`)) {
    sel.insertAdjacentHTML('beforeend', `<option value="${prod.id}" data-price="${prod.price||0}">${prod.name}</option>`);
  }
  sel.value = prod.id;
  if (prod.cost_price > 0) row.cells[2].querySelector('input').value = prod.cost_price;
  calcRow(sel);
  row.cells[1].querySelector('input').focus();
}

// ── Yangi tovar (skaner topilmaganda) ───────────────────────────────────────────
window.onReceiptProductNotFound = (barcode) => openNewProduct(barcode);

let npImageFile = null;
const _isDevUp = ['5500','5501','3000','4200','8080'].includes(location.port) && ['localhost','127.0.0.1'].includes(location.hostname);
const UPLOAD_BASE = _isDevUp ? 'http://localhost:8000/api/v1' : ((window.XENORA_SERVER||'')+'/api/v1');

function openNewProduct(barcode) {
  document.getElementById('npBarcode').value = barcode || '';
  document.getElementById('npName').value  = '';
  document.getElementById('npPrice').value = '';
  document.getElementById('npCost').value  = '';
  document.getElementById('npNewCat').value = '';
  document.getElementById('npNewCatRow').style.display = 'none';
  npImageFile = null;
  document.getElementById('npImage').value = '';
  const pv = document.getElementById('npImagePreview'); pv.style.display='none'; pv.src='';
  const sel = document.getElementById('npCat');
  sel.innerHTML = '<option value="">— tanlang —</option>'
    + categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('')
    + '<option value="__new__">➕ Yangi kategoriya...</option>';
  document.getElementById('npModal').classList.add('active');
  setTimeout(() => document.getElementById('npName').focus(), 120);
}

document.getElementById('npCat').addEventListener('change', function () {
  document.getElementById('npNewCatRow').style.display = this.value === '__new__' ? '' : 'none';
  if (this.value === '__new__') setTimeout(() => document.getElementById('npNewCat').focus(), 60);
});

// Rasm tanlash → preview (yuklash mahsulot yaratilgach)
document.getElementById('npImage').addEventListener('change', function () {
  const f = this.files && this.files[0];
  npImageFile = f || null;
  const pv = document.getElementById('npImagePreview');
  if (f) { pv.src = URL.createObjectURL(f); pv.style.display = ''; }
  else   { pv.style.display = 'none'; pv.src = ''; }
});

async function uploadProductImage(productId, file) {
  const fd = new FormData(); fd.append('file', file);
  const r = await fetch(`${UPLOAD_BASE}/products/${productId}/image`, {
    method: 'POST', headers: { Authorization: 'Bearer ' + localStorage.getItem('access_token') }, body: fd,
  });
  return r.ok ? r.json() : null;
}

window.saveNewProduct = async () => {
  const name  = document.getElementById('npName').value.trim();
  const price = parseFloat(document.getElementById('npPrice').value);
  if (!name)               { showToast('Nom kiriting', 'error'); return; }
  if (!price || price <= 0) { showToast('Sotuv narxini kiriting', 'error'); return; }

  const btn = document.getElementById('npSaveBtn');
  btn.disabled = true; btn.textContent = '...';
  try {
    // Kategoriya — majburiy (mavjud yoki yangi yaratiladi)
    let catId = document.getElementById('npCat').value;
    if (catId === '__new__') {
      const cname = document.getElementById('npNewCat').value.trim();
      if (!cname) { showToast('Yangi kategoriya nomini kiriting', 'error'); btn.disabled=false; btn.textContent='Saqlash + kirim'; return; }
      const cat = await api.post('/categories/', { name: cname });
      if (!cat || !cat.id) throw new Error(cat?.detail || 'Kategoriya yaratilmadi');
      catId = cat.id;
      categories.push(cat);
    }
    if (!catId) { showToast('Kategoriya tanlang', 'error'); btn.disabled=false; btn.textContent='Saqlash + kirim'; return; }

    const payload = {
      name, price,
      cost_price:  parseFloat(document.getElementById('npCost').value) || 0,
      barcode:     document.getElementById('npBarcode').value || null,
      category_id: parseInt(catId),
    };
    const prod = await api.post('/products/', payload);
    if (!prod || !prod.id) throw new Error(prod?.detail || 'Mahsulot yaratilmadi');

    // Rasm tanlangan bo'lsa — mahsulot yaratilgach yuklaymiz
    if (npImageFile) {
      const img = await uploadProductImage(prod.id, npImageFile);
      if (img && img.image_url) prod.image_url = img.image_url;
    }

    showToast('Tovar qo\'shildi', 'success');
    document.getElementById('npModal').classList.remove('active');
    addScannedProduct(prod);   // avtomatik kirim qatoriga
  } catch (e) {
    showToast(e.message || 'Xatolik', 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Saqlash + kirim';
  }
};

function statusLabel(s) {
  return s==='draft'?'Qoralama':s==='confirmed'?'Tasdiqlangan':s==='paid'?'To\'langan':s;
}
function fmt(n) { return Number(n||0).toLocaleString('uz-UZ'); }

function showToast(msg, type='info') {
  const el = document.createElement('div');
  el.style.cssText = `position:fixed;bottom:1.5rem;right:1.5rem;z-index:9999;padding:.75rem 1.25rem;border-radius:.625rem;color:#fff;background:${type==='success'?'#22c55e':type==='error'?'#ef4444':'#3b82f6'};font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.3)`;
  el.textContent = msg; document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

init();
</script>
